name: Windows Desktop PoC

on:
  push:
    branches:
      - windows-desktop-poc
    paths:
      - "desktop/**"
      - ".github/workflows/windows-desktop-poc.yml"
  pull_request:
    branches:
      - windows-desktop-poc
    paths:
      - "desktop/**"
      - ".github/workflows/windows-desktop-poc.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-desktop-poc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-build-test-package:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Print toolchain
        shell: pwsh
        run: |
          java -version
          gradle --version

      - name: Run desktop unit tests
        run: gradle -p desktop test --no-daemon

      - name: Build Windows MSI
        run: gradle -p desktop packageMsi --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mindunlock-windows-desktop-test-reports
          path: desktop/build/reports/tests/test/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Windows MSI
        uses: actions/upload-artifact@v4
        with:
          name: mindunlock-windows-desktop-msi
          path: desktop/build/compose/binaries/main/msi/*.msi
          if-no-files-found: error
          retention-days: 14

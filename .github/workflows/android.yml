                              value = readingHorizontalMargin,
                              onValueChange = {
                                  readingHorizontalMargin = it
                                  preferences.edit().putFloat("reading_horizontal_margin", it).apply()
                              },
                              valueRange = 8f..32f
                          )
                          OutlinedButton(

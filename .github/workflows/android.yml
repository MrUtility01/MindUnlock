          echo "=== APPLICATION STARTUP ==="
          nl -ba "$PACKAGE_DIR/MindUnlockApp.kt" | sed -n '1,180p'
          echo "=== MAIN ACTIVITY STARTUP ==="
          nl -ba "$PACKAGE_DIR/MainActivity.kt" | sed -n '55,115p'

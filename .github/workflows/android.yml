                  Text("MindUnlock · نسخهٔ " + appVersion, style = MaterialTheme.typography.bodyMedium)
                  Text("Android " + android.os.Build.VERSION.RELEASE + " · API " + android.os.Build.VERSION.SDK_INT, style = MaterialTheme.typography.bodySmall)
                  Text("شناسهٔ بسته: " + context.packageName, style = MaterialTheme.typography.bodySmall)
                  OutlinedButton(onClick = {
                      val report = "MindUnlock " + appVersion +
                          "\\nAndroid " + android.os.Build.VERSION.RELEASE +
                          " (API " + android.os.Build.VERSION.SDK_INT + ")" +
                          "\\nPackage: " + context.packageName +
                          "\\nSpeech status: " + speech.status.value
                      val clipboard = context.getSystemService("clipboard") as? android.content.ClipboardManager
                      clipboard?.setPrimaryClip(android.content.ClipData.newPlainText("MindUnlock diagnostics", report))
                      settingsMessage = if (clipboard != null) "اطلاعات فنی در کلیپ‌بورد کپی شد." else "دسترسی به کلیپ‌بورد ممکن نشد."
                  }, modifier = Modifier.fillMaxWidth()) {
                      Text("کپی اطلاعات فنی برای پشتیبانی")
                  }
                  if (showResetSettingsDialog) {
                      androidx.compose.material3.AlertDialog(
                          onDismissRequest = { showResetSettingsDialog = false },
                          title = { Text("بازنشانی تنظیمات؟") },
                          text = { Text("تم، اندازه نوشته، فاصله خطوط، حاشیه متن، سرعت و گوینده گفتار و روشن‌ماندن صفحه به حالت پیش‌فرض برمی‌گردند. اطلاعات مطالعه و رمز قفل حفظ می‌شوند.") },
                          confirmButton = {
                              Button(onClick = {
                                  theme.let { onThemeChange("dark") }
                                  fontScale = 1f
                                  onFontScaleChange(1f)
                                  speed = 1f
                                  voiceName = "gyro"

name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Android v0.3.3 source bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf android-build source-bundle
          mkdir -p android-build source-bundle
          SOURCE_ZIP="MindUnlock-Android-v0.3.1-source.zip"
          test -f "$SOURCE_ZIP"
          unzip -q "$SOURCE_ZIP" -d source-bundle
          SETTINGS_FILE="$(find source-bundle -type f -name settings.gradle.kts -print -quit)"
          test -n "$SETTINGS_FILE"
          ANDROID_DIR="$(dirname "$SETTINGS_FILE")"
          test -n "$ANDROID_DIR"
          cp -a "$ANDROID_DIR/." android-build/
          echo "Using Android source: $ANDROID_DIR"

          # Security UX correction: app-lock passwords accept 4+ characters.
          LOCK_FILE="$(find android-build/app/src/main/java -type f -name AppLock.kt -print -quit)"
          MAIN_FILE="$(find android-build/app/src/main/java -type f -name MainActivity.kt -print -quit)"
          SCREENS_FILE="$(find android-build/app/src/main/java -type f -name StudyScreens.kt -print -quit)"
          test -n "$LOCK_FILE" && test -n "$MAIN_FILE" && test -n "$SCREENS_FILE"
          python3 - "$LOCK_FILE" "$MAIN_FILE" "$SCREENS_FILE" <<'PY'
          from pathlib import Path
          import sys
          lock, main, screens = map(Path, sys.argv[1:])
          replacements = {
              lock: [('password.size >= 8', 'password.size >= 4'), ('حداقل ۸ نویسه', 'حداقل ۴ کاراکتر')],
              main: [('حداقل ۸ نویسه', 'حداقل ۴ کاراکتر'), ('lockPassword.length >= 8', 'lockPassword.length >= 4')],
              screens: [('حداقل ۸ نویسه', 'حداقل ۴ کاراکتر'), ('newAppPassword.length >= 8', 'newAppPassword.length >= 4')],
          }
          for path, pairs in replacements.items():
              data = path.read_text(encoding='utf-8')
              for old, new in pairs: data = data.replace(old, new)
              path.write_text(data, encoding='utf-8')
          PY

      - name: Apply uploaded portrait as Android launcher icon
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          source = Path("IMG_20261103_164024_548.jpg")
          if not source.is_file():
              raise SystemExit("Uploaded launcher portrait is missing")
          image = Image.open(source).convert("RGB")
          width, height = image.size
          side = int(min(width * 0.78, height * 0.78))
          left = max(0, min(width - side, int(width * 0.50 - side / 2)))
          top = max(0, min(height - side, int(height * 0.43 - side / 2)))
          crop = image.crop((left, top, left + side, top + side))
          sizes = {"mdpi": 48, "hdpi": 72, "xhdpi": 96, "xxhdpi": 144, "xxxhdpi": 192}
          for density, size in sizes.items():
              target = Path("android-build/app/src/main/res") / f"mipmap-{density}" / "ic_launcher.png"
              target.parent.mkdir(parents=True, exist_ok=True)
              crop.resize((size, size), Image.Resampling.LANCZOS).save(target, optimize=True)
          print("Launcher icons generated from uploaded portrait.")
          PY

      - name: Integrate offline Persian Piper TTS engine and model
        shell: bash
        run: |
          set -euo pipefail
          APP_DIR="android-build/app"
          SETTINGS="android-build/settings.gradle.kts"
          SPEECH_FILE="$(find "$APP_DIR/src/main/java" -type f -name PersianSpeech.kt -print -quit)"
          test -n "$SPEECH_FILE"
          python3 - "$SETTINGS" "$APP_DIR/build.gradle.kts" "$SPEECH_FILE" <<'PY'
          from pathlib import Path
          import sys
          settings, gradle, speech = map(Path, sys.argv[1:])
          s = settings.read_text(encoding="utf-8")
          if 'https://jitpack.io' not in s:
              s = s.replace('mavenCentral()','mavenCentral()\n        maven(url = "https://jitpack.io")')
          settings.write_text(s, encoding="utf-8")
          g = gradle.read_text(encoding="utf-8")
          dep = 'implementation("com.github.k2-fsa:sherpa-onnx:v1.13.8") { exclude(group = "com.github.k2-fsa.sherpa-onnx", module = "sherpa-onnx-jvm") }'
          if dep not in g:
              g = g.replace('dependencies {', 'dependencies {\n    ' + dep)
          g = g.replace('defaultConfig {', 'defaultConfig {\n        ndk { abiFilters += "arm64-v8a" }')
          if 'sherpa-onnx/native/**' not in g:
              g = g.replace('packaging {', 'packaging {\n        resources.excludes += "sherpa-onnx/native/**"\n        ')
          gradle.write_text(g, encoding="utf-8")
          speech.write_text(r'''package com.mindunlock.app

          import android.content.Context
          import android.media.AudioAttributes
          import android.media.AudioFormat
          import android.media.AudioTrack
          import android.speech.tts.Voice
          import androidx.compose.runtime.mutableStateOf
          import com.k2fsa.sherpa.onnx.OfflineTts
          import com.k2fsa.sherpa.onnx.OfflineTtsConfig
          import com.k2fsa.sherpa.onnx.OfflineTtsModelConfig
          import com.k2fsa.sherpa.onnx.OfflineTtsVitsModelConfig
          import java.io.File
          import java.util.concurrent.Executors
          import kotlin.concurrent.thread

          class PersianSpeech(context: Context) {
              private val appContext = context.applicationContext
              private val executor = Executors.newSingleThreadExecutor()
              @Volatile private var tts: OfflineTts? = null
              @Volatile private var audioTrack: AudioTrack? = null
              val ready = mutableStateOf(false)
              val error = mutableStateOf<String?>(null)
              val status = mutableStateOf("در حال آماده‌سازی موتور عصبی فارسی…")
              val voices = mutableStateOf<List<Voice>>(emptyList())

              init {
                  thread(name = "piper-fa-init") {
                      try {
                          val root = File(appContext.filesDir, "piper-fa")
                          val modelDir = File(root, "vits-piper-fa_IR-gyro-medium")
                          val espeakDir = File(modelDir, "espeak-ng-data")
                          copyAssetTree("vits-piper-fa_IR-gyro-medium", modelDir)
                          val model = File(modelDir, "fa_IR-gyro-medium.onnx")
                          val tokens = File(modelDir, "tokens.txt")
                          check(model.isFile && model.length() > 1_000_000L) { "فایل مدل صوتی فارسی ناقص است." }
                          check(tokens.isFile && espeakDir.isDirectory) { "فایل‌های زبان فارسی ناقص هستند." }
                          val config = OfflineTtsConfig(
                              model = OfflineTtsModelConfig(
                                  vits = OfflineTtsVitsModelConfig(
                                      model = model.absolutePath,
                                      tokens = tokens.absolutePath,
                                      dataDir = espeakDir.absolutePath
                                  ),
                                  numThreads = 2,
                                  debug = false,
                                  provider = "cpu"
                              )
                          )
                          val engine = OfflineTts(config = config)
                          check(engine.numSpeakers() > 0) { "مدل فارسی هیچ گوینده‌ای ارائه نکرد." }
                          tts = engine
                          ready.value = true
                          error.value = null
                          status.value = "موتور آفلاین Piper فارسی آماده است."
                      } catch (t: Throwable) {
                          error.value = "راه‌اندازی موتور فارسی ناموفق بود: ${t.message ?: t.javaClass.simpleName}"
                          status.value = error.value!!
                      }
                  }
              }

              private fun copyAssetTree(assetPath: String, target: File) {
                  val children = appContext.assets.list(assetPath).orEmpty()
                  if (children.isEmpty()) {
                      // A leaf in Android assets is a FILE, never create a directory at its path.
                      if (target.isFile && target.length() > 0L) return
                      target.parentFile?.mkdirs()
                      appContext.assets.open(assetPath).use { input ->
                          target.outputStream().use { output -> input.copyTo(output) }
                      }
                  } else {
                      if (target.exists() && !target.isDirectory) {
                          target.delete()
                      }
                      target.mkdirs()
                      children.forEach { child ->
                          copyAssetTree("$assetPath/$child", File(target, child))
                      }
                  }
              }

              fun speak(text: String, speed: Float = 1f, voiceName: String? = null) {
                  if (text.isBlank()) return
                  val engine = tts
                  if (engine == null) {
                      error.value = "موتور فارسی هنوز آماده نیست."
                      status.value = error.value!!
                      return
                  }
                  stop()
                  error.value = null
                  status.value = "در حال تولید صدای فارسی به‌صورت آفلاین…"
                  executor.execute {
                      try {
                          val audio = engine.generate(text = text, sid = 0, speed = speed.coerceIn(0.75f, 1.35f))
                          check(audio.samples.isNotEmpty()) { "مدل خروجی صوتی تولید نکرد." }
                          val minBuffer = AudioTrack.getMinBufferSize(
                              audio.sampleRate, AudioFormat.CHANNEL_OUT_MONO, AudioFormat.ENCODING_PCM_FLOAT
                          ).coerceAtLeast(audio.samples.size * 4)
                          val track = AudioTrack.Builder()
                              .setAudioAttributes(AudioAttributes.Builder()
                                  .setUsage(AudioAttributes.USAGE_MEDIA)
                                  .setContentType(AudioAttributes.CONTENT_TYPE_SPEECH).build())
                              .setAudioFormat(AudioFormat.Builder()
                                  .setSampleRate(audio.sampleRate)
                                  .setChannelMask(AudioFormat.CHANNEL_OUT_MONO)
                                  .setEncoding(AudioFormat.ENCODING_PCM_FLOAT).build())
                              .setBufferSizeInBytes(minBuffer)
                              .setTransferMode(AudioTrack.MODE_STATIC)
                              .build()
                          audioTrack = track
                          track.write(audio.samples, 0, audio.samples.size, AudioTrack.WRITE_BLOCKING)
                          track.play()
                          status.value = "صدای فارسی در حال پخش است."
                          while (track.playState == AudioTrack.PLAYSTATE_PLAYING &&
                              track.playbackHeadPosition < audio.samples.size) Thread.sleep(80)
                          track.release()
                          if (audioTrack === track) audioTrack = null
                          status.value = "خواندن فارسی با موتور Piper تمام شد."
                      } catch (t: Throwable) {
                          error.value = "خطا در تولید یا پخش صدای فارسی: ${t.message ?: t.javaClass.simpleName}"
                          status.value = error.value!!
                      }
                  }
              }

              fun stop() {
                  try { audioTrack?.pause(); audioTrack?.flush(); audioTrack?.release() } catch (_: Throwable) {}
                  audioTrack = null
                  status.value = "پخش متوقف شد."
              }

              fun close() {
                  stop()
                  executor.shutdownNow()
                  try { tts?.release() } catch (_: Throwable) {}
                  tts = null
              }
          }
          ''', encoding="utf-8")
          PY

          MODEL_URL="https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-fa_IR-gyro-medium.tar.bz2"
          mkdir -p "$APP_DIR/src/main/assets"
          curl --fail --location --retry 3 "$MODEL_URL" -o /tmp/piper-fa.tar.bz2
          test "$(stat -c%s /tmp/piper-fa.tar.bz2)" -gt 50000000
          tar -xjf /tmp/piper-fa.tar.bz2 -C /tmp
          test -s /tmp/vits-piper-fa_IR-gyro-medium/fa_IR-gyro-medium.onnx
          test -s /tmp/vits-piper-fa_IR-gyro-medium/tokens.txt
          test -d /tmp/vits-piper-fa_IR-gyro-medium/espeak-ng-data
          cp -a /tmp/vits-piper-fa_IR-gyro-medium "$APP_DIR/src/main/assets/"
          echo "Piper Persian model and eSpeak language data integrated."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create Gradle Wrapper
        working-directory: android-build
        run: |
          gradle wrapper --gradle-version 8.9
          chmod +x gradlew

      - name: Replace Android system TTS controls with in-app Piper manager
        shell: bash
        run: |
          set -euo pipefail
          SCREENS_FILE="$(find android-build/app/src/main/java -type f -name StudyScreens.kt -print -quit)"
          test -n "$SCREENS_FILE"
          python3 - "$SCREENS_FILE" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          s = p.read_text(encoding="utf-8")
          old = '''        OutlinedButton(onClick = { expanded = true }, modifier = Modifier.fillMaxWidth()) { Text(voices.firstOrNull { it.name == voiceName }?.name ?: "انتخاب صدای فارسی") }
                  DropdownMenu(expanded = expanded, onDismissRequest = { expanded = false }) {
                      voices.forEach { voice -> DropdownMenuItem(text = { Text(voice.name) }, onClick = { voiceName = voice.name; preferences.edit().putString("speech_voice", voice.name).apply(); expanded = false }) }
                  }
                  if (voices.isEmpty()) Text("اگر صدای فارسی در فهرست نیست، در تنظیمات گوشی به Text-to-speech برو و دادهٔ زبان فارسی را نصب کن. برای کار آفلاین، موتور باید بستهٔ صوتی محلی داشته باشد.", style = MaterialTheme.typography.bodySmall)'''
          new = '''        Card(Modifier.fillMaxWidth()) {
                      Column(Modifier.padding(12.dp), verticalArrangement = Arrangement.spacedBy(6.dp)) {
                          Text("موتور گفتار: Piper فارسی (Gyro Medium)", fontWeight = FontWeight.SemiBold)
                          Text("مدل صوتی داخل برنامه نگهداری می‌شود و برای تولید گفتار به موتور TTS اندروید یا اینترنت وابسته نیست.", style = MaterialTheme.typography.bodySmall)
                          Text(if (speech.ready.value) "وضعیت: آماده" else "وضعیت: در حال بارگذاری یا دارای خطا", style = MaterialTheme.typography.bodySmall)
                      }
                  }'''
          if old not in s:
              raise SystemExit("Expected legacy TTS voice selector block not found; refusing unsafe partial edit")
          s = s.replace(old, new, 1)
          old2 = '''        OutlinedButton(onClick = { runCatching { context.startActivity(Intent("android.speech.tts.engine.INSTALL_TTS_DATA").addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)) } }, modifier = Modifier.fillMaxWidth()) { Text("مدیریت / نصب داده‌های گفتار گوشی") }'''
          new2 = '''        OutlinedButton(onClick = { speech.stop() }, modifier = Modifier.fillMaxWidth()) { Text("توقف موتور گفتار") }'''
          if old2 not in s:
              raise SystemExit("Expected Android TTS settings action not found; refusing unsafe partial edit")
          s = s.replace(old2, new2, 1)
          p.write_text(s, encoding="utf-8")
          PY

      - name: Add independent Persian speech models
        shell: bash
        run: |
          set -euo pipefail
          ASSET_DIR="android-build/app/src/main/assets"
          mkdir -p "$ASSET_DIR"

          curl --fail --location --retry 3 "https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-fa_IR-amir-medium.tar.bz2" -o /tmp/piper-amir-fa.tar.bz2
          tar -xjf /tmp/piper-amir-fa.tar.bz2 -C /tmp
          test -s /tmp/vits-piper-fa_IR-amir-medium/fa_IR-amir-medium.onnx
          test -s /tmp/vits-piper-fa_IR-amir-medium/tokens.txt
          test -d /tmp/vits-piper-fa_IR-amir-medium/espeak-ng-data
          cp -a /tmp/vits-piper-fa_IR-amir-medium "$ASSET_DIR/"

          curl --fail --location --retry 3 "https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-mimic3-fa-haaniye_low.tar.bz2" -o /tmp/mimic3-haaniye-fa.tar.bz2
          tar -xjf /tmp/mimic3-haaniye-fa.tar.bz2 -C /tmp
          test -s /tmp/vits-mimic3-fa-haaniye_low/fa-haaniye_low.onnx
          test -s /tmp/vits-mimic3-fa-haaniye_low/tokens.txt
          test -d /tmp/vits-mimic3-fa-haaniye_low/espeak-ng-data
          cp -a /tmp/vits-mimic3-fa-haaniye_low "$ASSET_DIR/"
          echo "Three selectable Persian speech models are packaged."

      - name: Apply study workflow and UI redesign
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .github/refactor_android.py.xz.b64 | xz -d > /tmp/refactor_android.py
          MAIN_FILE="$(find android-build/app/src/main/java -type f -name MainActivity.kt -print -quit)"
          test -n "$MAIN_FILE"
          PACKAGE_DIR="$(dirname "$MAIN_FILE")"
          python3 /tmp/refactor_android.py "$PACKAGE_DIR"
          SCREENS_FILE="$(find "$PACKAGE_DIR" -type f -name StudyScreens.kt -print -quit)"
          test -n "$SCREENS_FILE"
          # The Android baseline does not bundle the extended FlashOn vector.
          # Reuse the already imported PlayArrow icon to keep dependencies lean.
          sed -i 's/FlashOn/PlayArrow/g' "$SCREENS_FILE"

      - name: Fix missing Compose fillMaxWidth import
        working-directory: android-build
        shell: bash
        run: |
          set -euo pipefail
          MAIN_FILE="$(find app/src/main/java -type f -name MainActivity.kt | head -n1)"
          test -n "$MAIN_FILE"
          if ! grep -Fqx 'import androidx.compose.foundation.layout.fillMaxWidth' "$MAIN_FILE"; then
            python3 - "$MAIN_FILE" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          text = p.read_text()
          lines = text.splitlines()
          package_index = next((i for i, line in enumerate(lines) if line.startswith("package ")), None)
          if package_index is None:
              raise SystemExit("Kotlin package declaration not found")
          lines.insert(package_index + 1, "import androidx.compose.foundation.layout.fillMaxWidth")
          p.write_text("\n".join(lines) + "\n")
          PY
          fi
          grep -n 'fillMaxWidth' "$MAIN_FILE"

      - name: Export prepared source snapshot for review
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/mindunlock-source-snapshot
          mkdir -p /tmp/mindunlock-source-snapshot
          cp -a android-build/app/src/main /tmp/mindunlock-source-snapshot/
          rm -rf /tmp/mindunlock-source-snapshot/main/assets/vits-*
          cp android-build/app/build.gradle.kts /tmp/mindunlock-source-snapshot/app-build.gradle.kts
          cp android-build/build.gradle.kts android-build/settings.gradle.kts android-build/gradle.properties /tmp/mindunlock-source-snapshot/
          (cd /tmp && zip -qr mindunlock-prepared-source.zip mindunlock-source-snapshot)
      - name: Upload prepared source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: MindUnlock-Android-source-snapshot
          path: /tmp/mindunlock-prepared-source.zip
          if-no-files-found: error

      - name: Build Debug APK
        working-directory: android-build
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MindUnlock-Android-v0.4.0-redesign-debug
          path: android-build/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish GitHub Release with APK
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v0.4.0-${{ github.run_number }}
          name: MindUnlock Android 0.4.0 (#${{ github.run_number }})
          body: |
            Android Native 0.4.0 redesigned learning workspace with topic/chapter navigation, image rendering, separate learning modes and three selectable Persian voices.
            Launcher icon uses the portrait uploaded in the repository.
            HTTP sync is intended for trusted local networks only.
          files: android-build/app/build/outputs/apk/debug/app-debug.apk
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

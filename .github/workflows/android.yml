          SCREENS_FILE="$(find android-build/app/src/main/java -type f -name StudyScreens.kt -print -quit)"
          test -n "$SCREENS_FILE"
          python3 - "$SCREENS_FILE" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          source = path.read_text(encoding="utf-8")
          branch = '                ResumeActionKind.ESSENTIAL_TOPICS -> onNavigate("later")\n'
          anchor = '                ResumeActionKind.ACTIVE_TOPIC -> onNavigate("later")'
          if branch.strip() not in source:
              if source.count(anchor) != 1:
                  raise SystemExit("Generated dashboard active-topic branch was not found exactly once.")
              source = source.replace(anchor, branch + anchor, 1)
              path.write_text(source, encoding="utf-8")
          print("Generated dashboard now handles essential side-question resume actions.")
          PY

      - name: Run JVM unit tests
        working-directory: android-build
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Verify JVM test report is non-empty
        working-directory: android-build
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          reports = sorted(Path("app/build/test-results/testDebugUnitTest").glob("TEST-*.xml"))
          if not reports:
              raise SystemExit("No JVM JUnit XML reports were generated; refusing a false-green test run.")

          totals = {"tests": 0, "failures": 0, "errors": 0, "skipped": 0}
          for report in reports:
              root = ET.parse(report).getroot()
              for key in totals:
                  totals[key] += int(root.attrib.get(key, 0))

          print("JVM test report totals:", totals)
          if totals["tests"] < 1:
              raise SystemExit("Zero tests were executed.")
          if totals["failures"] or totals["errors"]:
              raise SystemExit("JVM test report contains failures or errors.")
          with open(__import__("os").environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(
                  "\n### JVM test report\n"
                  f"- Tests: {totals['tests']}\n"
                  f"- Failures: {totals['failures']}\n"
                  f"- Errors: {totals['errors']}\n"
                  f"- Skipped: {totals['skipped']}\n"
              )
          PY

      - name: Build Debug APK
        working-directory: android-build
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify APK integrity and package metadata
        shell: bash
        run: |
          set -euo pipefail
          APK="android-build/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n1)"
          test -n "$AAPT"
          "$AAPT" dump badging "$APK" | tee /tmp/apk-badging.txt
          grep -Eq "^package: name='com\\.mindunlock\\.app(\\.debug)?'" /tmp/apk-badging.txt
          echo "APK_SIZE_BYTES=$(stat -c%s "$APK")" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "APK archive integrity and application package verified." | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Resolve Android artifact version
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME="$(sed -nE 's/.*versionName = "([^"]+)".*/\1/p' android-build/app/build.gradle.kts | head -n1)"
          test -n "$VERSION_NAME"
          echo "APK_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "Android artifact version: $VERSION_NAME" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MindUnlock-Android-v${{ env.APK_VERSION_NAME }}-debug
          path: android-build/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish GitHub Release with APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v0.6.13-${{ github.run_number }}
          name: MindUnlock Android 0.6.16 (#${{ github.run_number }})
          body: |
            Android Native 0.6.16 extends Jalali calendar presentation to backup restore metadata, in addition to the dashboard, Mind Dump, journal, planner, later-topic reminders and seven-day learning activity report; backup and restore preserve original epoch timestamps for learning sessions and exportedAt, while retaining encrypted backup and offline learning features using AES-256-GCM with PBKDF2-HMAC-SHA256 key derivation, authenticated import, and plaintext compatibility for older backups. It retains versioned user-data backup and restore with SHA-256 integrity validation, bounded JSON import, transactional replacement and automatic rolling pre-restore safety snapshots. The backup includes private progress, notes, bookmarks, tasks, Mind Dump, Journal, Later topics, lab checklists and learning sessions and session feedback; downloaded content, speech models, preferences and connection settings are intentionally excluded. It retains local learning analytics, persistent lab checklists, structured scenarios, spaced-repetition review, the Learning Engine, Learning Profile and offline Persian speech features.
            HTTP sync is intended for trusted local networks only.
          files: android-build/app/build/outputs/apk/debug/app-debug.apk
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
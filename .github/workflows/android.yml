      - name: Add persistent keep-screen-on reading preference
        shell: bash
        run: |
          set -euo pipefail
          SCREENS_FILE="$(find android-build/app/src/main/java -type f -name StudyScreens.kt -print -quit)"
          test -n "$SCREENS_FILE"
          python3 - "$SCREENS_FILE" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          source = path.read_text(encoding="utf-8")
          newline = chr(10)

          settings_start = source.find("fun SettingsScreen(")
          if settings_start < 0:
              raise SystemExit("SettingsScreen declaration not found")
          voice_marker = "val voices = speech.voiceOptions"
          voice_at = source.find(voice_marker, settings_start)
          if voice_at < 0:
              raise SystemExit("Could not locate voiceOptions in SettingsScreen")

          if "keepScreenOnWhileReading" not in source:
              line_end = source.find(newline, voice_at)
              if line_end < 0:
                  raise SystemExit("SettingsScreen voiceOptions line is malformed")
              state_line = '    var keepScreenOnWhileReading by remember { mutableStateOf(preferences.getBoolean("keep_screen_on_while_reading", true)) }' + newline
              source = source[:line_end + 1] + state_line + source[line_end + 1:]

          ui_marker = '        Text("خواندن با صدای فارسی", style = MaterialTheme.typography.titleMedium, fontWeight = FontWeight.Bold)'
          ui_block = '''        Text("مطالعه", style = MaterialTheme.typography.titleMedium, fontWeight = FontWeight.Bold)
                  OutlinedButton(
                      onClick = {
                          keepScreenOnWhileReading = !keepScreenOnWhileReading
                          preferences.edit().putBoolean("keep_screen_on_while_reading", keepScreenOnWhileReading).apply()
                      },
                      modifier = Modifier.fillMaxWidth()
                  ) {
                      Text(if (keepScreenOnWhileReading) "روشن ماندن صفحه هنگام مطالعه: فعال" else "روشن ماندن صفحه هنگام مطالعه: غیرفعال")
                  }
                  Text("این گزینه فقط هنگام باز بودن صفحهٔ مطالعه اثر می‌کند؛ با خروج از مطالعه، محدودیت روشن‌ماندن صفحه برداشته می‌شود.", style = MaterialTheme.typography.bodySmall)
          '''
          if "روشن ماندن صفحه هنگام مطالعه:" not in source:
              if source.count(ui_marker) != 1:
                  raise SystemExit("Settings UI insertion marker missing or ambiguous")
              source = source.replace(ui_marker, ui_block + ui_marker, 1)

          reader_start = source.find("fun ReaderScreen(")
          if reader_start < 0:
              raise SystemExit("ReaderScreen declaration not found")
          if "keepAwakeActivity" not in source:
              opening_brace = source.find("{", reader_start)
              if opening_brace < 0 or opening_brace - reader_start > 1200:
                  raise SystemExit("ReaderScreen opening brace not found near declaration")
              reader_code = '''
              val keepAwakeContext = androidx.compose.ui.platform.LocalContext.current
              val keepAwakeActivity = androidx.compose.runtime.remember(keepAwakeContext) {
                  var node: android.content.Context? = keepAwakeContext
                  while (node != null && node !is android.app.Activity) {
                      node = (node as? android.content.ContextWrapper)?.baseContext
                  }
                  node as? android.app.Activity
              }
              val keepAwakeEnabled = preferences.getBoolean("keep_screen_on_while_reading", true)
              androidx.compose.runtime.DisposableEffect(keepAwakeActivity, keepAwakeEnabled) {
                  val window = keepAwakeActivity?.window
                  if (keepAwakeEnabled) {
                      window?.addFlags(android.view.WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  } else {
                      window?.clearFlags(android.view.WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  }
                  onDispose {
                      window?.clearFlags(android.view.WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  }
              }
          '''
              source = source[:opening_brace + 1] + reader_code + source[opening_brace + 1:]

          path.write_text(source, encoding="utf-8")
          print("Added persistent reading-only keep-screen-on preference with lifecycle cleanup.")
          PY



      - name: Add notes export and bookmark search/delete controls
        shell: bash
        run: |
          set -euo pipefail
          SCREENS_FILE="$(find android-build/app/src/main/java -type f -name StudyScreens.kt -print -quit)"
          test -n "$SCREENS_FILE"
          python3 - "$SCREENS_FILE" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          source = path.read_text(encoding="utf-8")

          for import_line in (
              "import androidx.activity.compose.rememberLauncherForActivityResult",
              "import androidx.activity.result.contract.ActivityResultContracts",
          ):
              if import_line not in source:
                  package_end = source.find(chr(10))
                  if package_end < 0:
                      raise SystemExit("Kotlin package declaration not found")
                  source = source[:package_end + 1] + chr(10) + import_line + source[package_end + 1:]

          def replace_composable(name: str, replacement: str) -> None:
              global source
              signature = "fun " + name + "("
              at = source.find(signature)
              if at < 0:
                  raise SystemExit(name + " declaration not found")
              start = source.rfind("@Composable", 0, at)
              if start < 0:
                  raise SystemExit(name + " @Composable annotation not found")
              end = source.find(chr(10) + "@Composable", at)
              if end < 0:
                  raise SystemExit("Could not find the end boundary for " + name)
              source = source[:start] + replacement.rstrip() + chr(10) + chr(10) + source[end + 1:]

          notes_screen = r'''@Composable
          fun NotesScreen(userDb: UserDatabase) {
              val notes by userDb.noteDao().observeAll().collectAsState(initial = emptyList())
              val scope = rememberCoroutineScope()
              val context = LocalContext.current
              var showDialog by remember { mutableStateOf(false) }
              var editingId by remember { mutableStateOf<Long?>(null) }
              var title by remember { mutableStateOf("") }
              var body by remember { mutableStateOf("") }
              var query by rememberSaveable { mutableStateOf("") }
              var exportMessage by remember { mutableStateOf("") }
              val visible = notes.filter { query.isBlank() || it.title.contains(query, true) || it.body.contains(query, true) }
              val exportLauncher = rememberLauncherForActivityResult(
                  contract = ActivityResultContracts.CreateDocument("text/plain")
              ) { uri ->
                  if (uri != null) {
                      val snapshot = notes.sortedByDescending { it.updatedAt }
                      scope.launch {
                          val result = kotlinx.coroutines.withContext(kotlinx.coroutines.Dispatchers.IO) {
                              runCatching {
                                  val output = context.contentResolver.openOutputStream(uri)
                                      ?: error("امکان باز کردن فایل مقصد وجود ندارد.")
                                  output.bufferedWriter(Charsets.UTF_8).use { writer ->
                                      writer.appendLine("یادداشت‌های MindUnlock")
                                      writer.appendLine("تعداد: " + snapshot.size)
                                      writer.appendLine()
                                      snapshot.forEachIndexed { index, note ->
                                          writer.appendLine((index + 1).toString() + ". " + note.title)
                                          writer.appendLine(note.body)
                                          if (!note.chapterId.isNullOrBlank()) writer.appendLine("شناسه فصل: " + note.chapterId)
                                          if (!note.itemUid.isNullOrBlank()) writer.appendLine("شناسه مطلب: " + note.itemUid)
                                          writer.appendLine()
                                          writer.appendLine("----------------------------------------")
                                          writer.appendLine()
                                      }
                                  }
                              }
                          }
                          exportMessage = result.fold(
                              { "خروجی " + snapshot.size + " یادداشت ذخیره شد." },
                              { "ذخیرهٔ خروجی ناموفق بود: " + (it.message ?: "خطای ناشناخته") }
                          )
                      }
                  } else {
                      exportMessage = "ذخیرهٔ خروجی لغو شد."
                  }
              }

              Column(Modifier.fillMaxSize().padding(16.dp), verticalArrangement = Arrangement.spacedBy(10.dp)) {
                  Text("یادداشت‌ها · " + notes.size, style = MaterialTheme.typography.titleMedium, fontWeight = FontWeight.Bold)
                  Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                      Button(
                          onClick = { editingId = null; title = ""; body = ""; showDialog = true },
                          modifier = Modifier.weight(1f)
                      ) { Icon(Icons.Default.Add, null); Text("یادداشت جدید") }
                      OutlinedButton(
                          onClick = { exportLauncher.launch("MindUnlock-Notes.txt") },
                          enabled = notes.isNotEmpty(),
                          modifier = Modifier.weight(1f)
                      ) { Icon(Icons.Default.Download, null); Text("خروجی همه") }
                  }
                  OutlinedTextField(query, { query = it }, Modifier.fillMaxWidth(), label = { Text("جست‌وجو در یادداشت‌ها") }, singleLine = true)
                  if (exportMessage.isNotBlank()) Text(exportMessage, style = MaterialTheme.typography.bodySmall, color = MaterialTheme.colorScheme.primary)
                  LazyColumn(verticalArrangement = Arrangement.spacedBy(8.dp), modifier = Modifier.weight(1f)) {
                      if (visible.isEmpty()) {
                          item { EmptyMessage(if (notes.isEmpty()) "هنوز یادداشتی ذخیره نشده است." else "یادداشتی با این عبارت پیدا نشد.") }
                      }
                      items(visible, key = { it.id }) { note ->
                          Card(onClick = { editingId = note.id; title = note.title; body = note.body; showDialog = true }, modifier = Modifier.fillMaxWidth()) {
                              Column(Modifier.fillMaxWidth().padding(13.dp), verticalArrangement = Arrangement.spacedBy(5.dp)) {
                                  Row(verticalAlignment = Alignment.CenterVertically) {
                                      Text(note.title, fontWeight = FontWeight.SemiBold, modifier = Modifier.weight(1f))
                                      IconButton(onClick = { scope.launch { userDb.noteDao().delete(note.id) } }) {
                                          Icon(Icons.Default.Delete, contentDescription = "حذف")
                                      }
                                  }
                                  Text(note.body, maxLines = 4, overflow = TextOverflow.Ellipsis)
                                  if (!note.chapterId.isNullOrBlank()) Text("متصل به فصل", style = MaterialTheme.typography.labelSmall, color = MaterialTheme.colorScheme.primary)
                              }
                          }
                      }
                  }
              }
              if (showDialog) AlertDialog(
                  onDismissRequest = { showDialog = false },
                  title = { Text(if (editingId == null) "یادداشت جدید" else "ویرایش یادداشت") },
                  text = {
                      Column(verticalArrangement = Arrangement.spacedBy(8.dp)) {
                          OutlinedTextField(title, { title = it }, label = { Text("عنوان") }, singleLine = true)
                          OutlinedTextField(body, { body = it }, label = { Text("متن") }, minLines = 4)
                      }
                  },
                  confirmButton = {
                      TextButton(onClick = {
                          if (body.isNotBlank()) scope.launch {
                              val old = notes.firstOrNull { it.id == editingId }
                              userDb.noteDao().upsert(
                                  NoteEntity(
                                      id = editingId ?: 0L,
                                      itemUid = old?.itemUid,
                                      chapterId = old?.chapterId,
                                      title = title.ifBlank { "یادداشت" },
                                      body = body.trim(),
                                      updatedAt = System.currentTimeMillis()
                                  )
                              )
                          }
                          showDialog = false
                      }) { Text("ذخیره") }
                  },
                  dismissButton = { TextButton(onClick = { showDialog = false }) { Text("انصراف") } }
              )
          }'''

          bookmarks_screen = r'''@Composable
          fun BookmarksScreen(db: AppDatabase, userDb: UserDatabase, onOpenItem: (String) -> Unit) {
              val bookmarks by userDb.bookmarkDao().observeAll().collectAsState(initial = emptyList())
              val all by db.contentItemDao().observeAll().collectAsState(initial = emptyList())
              val scope = rememberCoroutineScope()
              var query by rememberSaveable { mutableStateOf("") }
              var pendingRemoval by remember { mutableStateOf<String?>(null) }
              val saved = bookmarks.mapNotNull { mark -> all.firstOrNull { it.uid == mark.itemUid } }
              val visible = saved.filter { item ->
                  query.isBlank() ||
                      item.title.orEmpty().contains(query, true) ||
                      item.summary.orEmpty().contains(query, true) ||
                      item.content.orEmpty().contains(query, true) ||
                      item.chapterId.contains(query, true)
              }

              Column(Modifier.fillMaxSize().padding(16.dp), verticalArrangement = Arrangement.spacedBy(10.dp)) {
                  Text("نشانک‌ها · " + bookmarks.size, style = MaterialTheme.typography.titleMedium, fontWeight = FontWeight.Bold)
                  OutlinedTextField(query, { query = it }, Modifier.fillMaxWidth(), label = { Text("جست‌وجو در نشانک‌ها") }, singleLine = true)
                  LazyColumn(Modifier.weight(1f), verticalArrangement = Arrangement.spacedBy(8.dp)) {
                      if (visible.isEmpty()) {
                          item { EmptyMessage(if (saved.isEmpty()) "هنوز نشانکی ذخیره نشده است." else "نشانکی با این عبارت پیدا نشد.") }
                      }
                      items(visible, key = { it.uid }) { item ->
                          Card(Modifier.fillMaxWidth()) {
                              Row(Modifier.fillMaxWidth().padding(12.dp), verticalAlignment = Alignment.CenterVertically) {
                                  Column(
                                      Modifier.weight(1f).clickable { onOpenItem(item.uid) },
                                      verticalArrangement = Arrangement.spacedBy(4.dp)
                                  ) {
                                      Text(item.title ?: "بدون عنوان", fontWeight = FontWeight.SemiBold)
                                      Text(kindLabel(item.type), style = MaterialTheme.typography.labelSmall, color = MaterialTheme.colorScheme.primary)
                                      if (!item.summary.isNullOrBlank()) {
                                          Text(cleanHtml(item.summary), maxLines = 2, overflow = TextOverflow.Ellipsis, style = MaterialTheme.typography.bodySmall)
                                      }
                                  }
                                  IconButton(onClick = { pendingRemoval = item.uid }) {
                                      Icon(Icons.Default.Delete, contentDescription = "حذف نشانک")
                                  }
                              }
                          }
                      }
                  }
              }

              pendingRemoval?.let { uid ->
                  AlertDialog(
                      onDismissRequest = { pendingRemoval = null },
                      title = { Text("حذف نشانک") },
                      text = { Text("این مطلب از فهرست نشانک‌ها حذف شود؟ محتوای اصلی و یادداشت‌های آن پاک نمی‌شوند.") },
                      confirmButton = {
                          TextButton(onClick = {
                              scope.launch { userDb.bookmarkDao().delete(uid) }
                              pendingRemoval = null
                          }) { Text("حذف نشانک") }
                      },
                      dismissButton = { TextButton(onClick = { pendingRemoval = null }) { Text("انصراف") } }
                  )
              }
          }'''

          replace_composable("NotesScreen", notes_screen)
          replace_composable("BookmarksScreen", bookmarks_screen)

          path.write_text(source, encoding="utf-8")
          print("Notes export, note editing timestamp, bookmark search and confirmed bookmark deletion added.")
          PY


      - name: Inspect reader, notes, bookmarks and database integration points
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_DIR="$(dirname "$(find android-build/app/src/main/java -type f -name MainActivity.kt -print -quit)")"
          SCREENS="$PACKAGE_DIR/ui/StudyScreens.kt"
          echo "=== READER / NOTES / BOOKMARKS IMPLEMENTATIONS ==="
          python3 - "$SCREENS" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          lines = path.read_text(encoding="utf-8").splitlines()
          for target in ("ReaderScreen", "NotesScreen", "BookmarksScreen"):
              starts = [i for i, line in enumerate(lines) if line.startswith("fun " + target + "(")]
              if not starts:
                  print("--- " + target + ": NOT FOUND ---")
                  continue
              start = starts[0]
              end = next((i for i in range(start + 1, len(lines)) if lines[i].startswith("@Composable")), min(len(lines), start + 180))
              print("--- " + target + " lines " + str(start + 1) + "-" + str(end) + " ---")
              for n in range(start, min(end, start + 180)):
                  print(str(n + 1) + ": " + lines[n])
          PY
          echo "=== DATABASE / DAO DECLARATIONS ==="
          find "$PACKAGE_DIR/data" -type f -name '*.kt' -print0 | while IFS= read -r -d '' file; do
            if grep -qE '(@Dao|@Entity|interface .*Dao|abstract class .*Database|data class .*Entity|@Query|@Upsert|@Insert|@Delete)' "$file"; then
              echo "--- $file ---"
              grep -nE '(@Dao|@Entity|interface .*Dao|abstract class .*Database|data class .*Entity|@Query|@Upsert|@Insert|@Delete|fun (insert|update|delete|observe|get|all|save|upsert))' "$file" | head -220 || true
            fi
          done | tee "$GITHUB_STEP_SUMMARY"

      - name: Add persistent reading typography and margin controls
        shell: bash
        run: |
          set -euo pipefail
          SCREENS_FILE="$(find android-build/app/src/main/java -type f -name StudyScreens.kt -print -quit)"
          test -n "$SCREENS_FILE"
          python3 - "$SCREENS_FILE" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          source = path.read_text(encoding="utf-8")
          if (
              "readingLineSpacing by remember" in source
              and "readingHorizontalMargin by remember" in source
              and "readingHorizontalMargin.dp" in source
              and "fontSize * readingLineSpacing" in source
          ):
              print("Persistent reading typography and margins are already implemented; skipping legacy patch.")
              raise SystemExit(0)
          lines = source.splitlines()

          def unique_line(predicate, label):
              matches = [i for i, line in enumerate(lines) if predicate(line)]
              if len(matches) != 1:
                  raise SystemExit(label + " marker expected once, found " + str(len(matches)))
              return matches[0]

          # Persistent settings state, separate from the app-wide font scale.
          font_state = 'var fontScale by remember { mutableStateOf(preferences.getFloat("font_scale", 1f)) }'
          font_index = unique_line(lambda line: line.strip() == font_state, "SettingsScreen fontScale")
          if not any("readingLineSpacing by remember" in line for line in lines):
              lines[font_index + 1:font_index + 1] = [
                  '    var readingLineSpacing by remember { mutableStateOf(preferences.getFloat("reading_line_spacing", 1.45f)) }',
                  '    var readingHorizontalMargin by remember { mutableStateOf(preferences.getFloat("reading_horizontal_margin", 16f)) }'
              ]

          # Real sliders save immediately to SharedPreferences.
          speech_heading = 'Text("خواندن با صدای فارسی", style = MaterialTheme.typography.titleMedium, fontWeight = FontWeight.Bold)'
          if not any("حاشیه افقی متن:" in line for line in lines):
              ui_index = unique_line(lambda line: line.strip() == speech_heading, "speech settings heading")
              controls = [
                  '        Text("تنظیمات صفحه مطالعه", style = MaterialTheme.typography.titleMedium, fontWeight = FontWeight.Bold)',
                  '        Text("فاصله خطوط: " + String.format(Locale.ROOT, "%.2f", readingLineSpacing) + "×")',
                  '        Slider(',
                  '            value = readingLineSpacing,',
                  '            onValueChange = { value ->',
                  '                readingLineSpacing = value',
                  '                preferences.edit().putFloat("reading_line_spacing", value).apply()',
                  '            },',
                  '            valueRange = 1.1f..2.2f',
                  '        )',
                  '        Text("حاشیه افقی متن: " + String.format(Locale.ROOT, "%.0f", readingHorizontalMargin) + " dp")',
                  '        Slider(',
                  '            value = readingHorizontalMargin,',
                  '            onValueChange = { value ->',
                  '                readingHorizontalMargin = value',
                  '                preferences.edit().putFloat("reading_horizontal_margin", value).apply()',
                  '            },',
                  '            valueRange = 8f..32f',
                  '        )',
                  '        Text("تغییرات بلافاصله ذخیره می‌شوند و در صفحه مطالعه اعمال خواهند شد.", style = MaterialTheme.typography.bodySmall)'
              ]
              lines[ui_index:ui_index] = controls

          # Read the same persisted values when the reader is opened.
          reader_start = unique_line(lambda line: line.startswith("fun ReaderScreen("), "ReaderScreen")
          keep_line = next((i for i in range(reader_start, len(lines)) if 'val keepAwakeEnabled = preferences.getBoolean("keep_screen_on_while_reading", true)' in lines[i]), -1)
          if keep_line < 0:
              raise SystemExit("ReaderScreen keep-screen-on preference marker not found")
          if not any('val readingLineSpacing = preferences.getFloat("reading_line_spacing"' in line for line in lines[reader_start:]):
              lines[keep_line + 1:keep_line + 1] = [
                  '    val readingLineSpacing = preferences.getFloat("reading_line_spacing", 1.45f).coerceIn(1.1f, 2.2f)',
                  '    val readingHorizontalMargin = preferences.getFloat("reading_horizontal_margin", 16f).coerceIn(8f, 32f)'
              ]

          old_content = 'if (!current.content.isNullOrBlank()) Text(cleanHtml(current.content), style = MaterialTheme.typography.bodyLarge)'
          new_content = '''if (!current.content.isNullOrBlank()) {
                  Text(
                      cleanHtml(current.content),
                      modifier = Modifier.padding(horizontal = readingHorizontalMargin.dp),
                      style = MaterialTheme.typography.bodyLarge.copy(
                          lineHeight = MaterialTheme.typography.bodyLarge.fontSize * readingLineSpacing
                      )
                  )
              }'''
          if any("readingHorizontalMargin.dp" in line for line in lines):
              pass
          else:
              content_index = unique_line(lambda line: line.strip() == old_content, "reader content Text")
              indent = lines[content_index][:len(lines[content_index]) - len(lines[content_index].lstrip())]
              lines[content_index:content_index + 1] = [indent + part if part else "" for part in new_content.splitlines()]

          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          print("Persistent line spacing and horizontal text margins added to SettingsScreen and ReaderScreen.")
          PY



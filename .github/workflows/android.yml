                          )
                          Text("پاک‌سازی حافظه موقت، یادداشت‌ها، پیشرفت، نشانک‌ها و مدل‌های صوتی نصب‌شده را حذف نمی‌کند.", style = MaterialTheme.typography.bodySmall)
                          OutlinedButton(

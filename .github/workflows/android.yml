      - name: Move legacy migration off the Android startup thread
        shell: bash
        run: |
          set -euo pipefail
          MAIN_FILE="$(find android-build/app/src/main/java -type f -name MainActivity.kt -print -quit)"
          test -n "$MAIN_FILE"
          python3 - "$MAIN_FILE" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          source = path.read_text(encoding="utf-8")

          # Replace the synchronous startup call; never block Android's main thread.
          old_import = "import kotlinx.coroutines.runBlocking"
          if old_import in source:
              source = source.replace(old_import, "import androidx.compose.runtime.LaunchedEffect", 1)
          elif "import androidx.compose.runtime.LaunchedEffect" not in source:
              package_end = source.find(chr(10))
              if package_end < 0:
                  raise SystemExit("MainActivity package declaration not found")
              source = source[:package_end + 1] + "import androidx.compose.runtime.LaunchedEffect" + chr(10) + source[package_end + 1:]

          blocking_call = "runBlocking(Dispatchers.IO) { LegacyDatabaseMigrator.migrate(this@MainActivity, app.repository.database, userDatabase) }"
          if blocking_call not in source:
              raise SystemExit("Blocking legacy migration call not found")
          source = source.replace(blocking_call, "", 1)

          state_anchor = '            var lockError by rememberSaveable { mutableStateOf("") }'
          states_and_effect = '''            var startupReady by rememberSaveable { mutableStateOf(false) }
                      var migrationError by rememberSaveable { mutableStateOf("") }
                      var migrationAttempt by rememberSaveable { mutableStateOf(0) }

                      LaunchedEffect(migrationAttempt) {
                          migrationError = ""
                          try {
                              withContext(Dispatchers.IO) {
                                  LegacyDatabaseMigrator.migrate(this@MainActivity, app.repository.database, userDatabase)
                              }
                              startupReady = true
                          } catch (error: Exception) {
                              migrationError = error.message ?: "انتقال اطلاعات قدیمی ناموفق بود."
                              android.util.Log.e("MindUnlockStartup", "Legacy database migration failed", error)
                          }
                      }'''
          if source.count(state_anchor) != 1:
              raise SystemExit("MainActivity startup state insertion point not found uniquely")
          source = source.replace(state_anchor, state_anchor + chr(10) + states_and_effect, 1)

          gate_marker = "if (!unlocked) {"
          if source.count(gate_marker) != 1:
              raise SystemExit("MainActivity app-lock branch marker not found uniquely")
          loading_gate = '''if (!startupReady) {
                              Column(
                                  Modifier.fillMaxSize().padding(28.dp),
                                  verticalArrangement = Arrangement.Center,
                                  horizontalAlignment = Alignment.CenterHorizontally
                              ) {
                                  Text("MindUnlock · آماده‌سازی برنامه", style = MaterialTheme.typography.headlineSmall)
                                  if (migrationError.isBlank()) {
                                      CircularProgressIndicator()
                                      Text("در حال آماده‌سازی و انتقال اطلاعات قبلی...")
                                  } else {
                                      Text("آماده‌سازی کامل نشد: $migrationError", color = MaterialTheme.colorScheme.error)
                                      Button(onClick = { migrationAttempt += 1 }, modifier = Modifier.fillMaxWidth()) {
                                          Text("تلاش مجدد")
                                      }
                                  }
                              }
                          } else if (!unlocked) {'''
          source = source.replace(gate_marker, loading_gate, 1)

          if "import androidx.compose.material3.CircularProgressIndicator" not in source:
              source = source.replace(
                  "import androidx.compose.runtime.LaunchedEffect",
                  "import androidx.compose.runtime.LaunchedEffect" + chr(10) + "import androidx.compose.material3.CircularProgressIndicator",
                  1
              )

          if "import androidx.compose.ui.Alignment" not in source:
              source = source.replace(
                  "import androidx.compose.runtime.LaunchedEffect",
                  "import androidx.compose.runtime.LaunchedEffect" + chr(10) + "import androidx.compose.ui.Alignment",
                  1
              )

          if "runBlocking" in source:
              raise SystemExit("Blocking code remains in MainActivity")
          if "LaunchedEffect(migrationAttempt)" not in source or "withContext(Dispatchers.IO)" not in source or "startupReady = true" not in source:
              raise SystemExit("Asynchronous migration code was not installed")

          migrator_path = path.parent / "data" / "local" / "LegacyDatabaseMigrator.kt"
          migrator = migrator_path.read_text(encoding="utf-8")
          old_signature = "    @Synchronized fun migrate(context: Context, content: AppDatabase, user: UserDatabase) {"
          new_signature = "    @Synchronized fun migrate(context: Context, content: AppDatabase, user: UserDatabase, onProgress: (String) -> Unit = {}) {"
          if old_signature not in migrator: raise SystemExit("Legacy migrator signature not found")
          migrator = migrator.replace(old_signature, new_signature, 1)
          migrator = migrator.replace(
              '        val prefs = context.getSharedPreferences("mindunlock_db_migration", Context.MODE_PRIVATE)',
              '        val startedAt = System.nanoTime()\n        onProgress("بررسی انتقال اطلاعات قدیمی...")\n        android.util.Log.i("MindUnlockStartup", "Legacy migration started")\n        val prefs = context.getSharedPreferences("mindunlock_db_migration", Context.MODE_PRIVATE)',
              1
          )
          migrator = migrator.replace(
              '        if (prefs.getBoolean("split_v1_complete", false)) return',
              '        if (prefs.getBoolean("split_v1_complete", false)) { onProgress("انتقال اطلاعات قبلی قبلاً انجام شده است."); android.util.Log.i("MindUnlockStartup", "Legacy migration skipped: complete marker present"); return }',
              1
          )
          table_calls = [
              ('copyTable(source, contentTarget, "chapters")', 'onProgress("انتقال فصل‌ها...")\n                copyTable(source, contentTarget, "chapters")'),
              ('copyTable(source, contentTarget, "content_items")', 'onProgress("انتقال محتوای آموزشی...")\n                copyTable(source, contentTarget, "content_items")'),
              ('copyTable(source, contentTarget, "server_config")', 'onProgress("انتقال تنظیمات سرور...")\n                copyTable(source, contentTarget, "server_config")'),
              ('copyTable(source, contentTarget, "media_cache")', 'onProgress("انتقال حافظه رسانه...")\n                copyTable(source, contentTarget, "media_cache")'),
              ('copyTable(source, userTarget, "progress")', 'onProgress("انتقال پیشرفت مطالعه...")\n                copyTable(source, userTarget, "progress")'),
              ('copyTable(source, userTarget, "notes")', 'onProgress("انتقال یادداشت‌ها...")\n                copyTable(source, userTarget, "notes")'),
              ('copyTable(source, userTarget, "bookmarks")', 'onProgress("انتقال نشانک‌ها...")\n                copyTable(source, userTarget, "bookmarks")'),
              ('copyTable(source, userTarget, "study_tasks")', 'onProgress("انتقال برنامه‌های مطالعه...")\n                copyTable(source, userTarget, "study_tasks")')
          ]
          for old_call, new_call in table_calls:
              if old_call not in migrator: raise SystemExit("Legacy table copy call missing: " + old_call)
              migrator = migrator.replace(old_call, new_call, 1)
          old_complete = '            prefs.edit().putBoolean("split_v1_complete", true).apply()'
          new_complete = '            prefs.edit().putBoolean("split_v1_complete", true).apply()\n            val elapsedMs = (System.nanoTime() - startedAt) / 1_000_000\n            onProgress("انتقال اطلاعات کامل شد؛ زمان: " + elapsedMs + " میلی‌ثانیه")\n            android.util.Log.i("MindUnlockStartup", "Legacy migration completed in " + elapsedMs + "ms")'
          if old_complete not in migrator: raise SystemExit("Legacy completion marker not found")
          migrator = migrator.replace(old_complete, new_complete, 1)
          migrator_path.write_text(migrator, encoding="utf-8")

          call_old = "LegacyDatabaseMigrator.migrate(this@MainActivity, app.repository.database, userDatabase)"
          call_new = "LegacyDatabaseMigrator.migrate(this@MainActivity, app.repository.database, userDatabase, onProgress = { phase -> runOnUiThread { migrationStatus = phase } })"
          if call_old not in source: raise SystemExit("MainActivity migration call not found")
          source = source.replace(call_old, call_new, 1)
          source = source.replace(
              'var migrationError by rememberSaveable { mutableStateOf("") }',
              'var migrationError by rememberSaveable { mutableStateOf("") }\n                      var migrationStatus by rememberSaveable { mutableStateOf("شروع آماده‌سازی...") }',
              1
          )
          source = source.replace('migrationError = ""\n                          try {', 'migrationError = ""\n                          migrationStatus = "شروع آماده‌سازی..."\n                          try {', 1)
          source = source.replace(
              'Text("در حال آماده‌سازی و انتقال اطلاعات قبلی...")',
              'Text(migrationStatus, color = MaterialTheme.colorScheme.onSurfaceVariant)',
              1
          )

          path.write_text(source, encoding="utf-8")
          print("Legacy migration now runs asynchronously with per-table phase progress and elapsed-time diagnostics.")
          PY
          python3 - "$MAIN_FILE" <<'PY'
          from pathlib import Path
          import sys
          source = Path(sys.argv[1]).read_text(encoding="utf-8")
          assert "runBlocking" not in source
          assert "LaunchedEffect(migrationAttempt)" in source
          assert "withContext(Dispatchers.IO)" in source
          assert "startupReady = true" in source
          assert "if (!startupReady)" in source
          assert 'Text("تلاش مجدد")' in source
          assert "CircularProgressIndicator()" in source
          print("Non-blocking startup assertions passed.")
          PY

      - name: Diagnose topic and chapter navigation plus import paths

      - name: Add persistent keep-screen-on reading preference
        shell: bash
        run: |
          set -euo pipefail
          SCREENS_FILE="$(find android-build/app/src/main/java -type f -name StudyScreens.kt -print -quit)"
          test -n "$SCREENS_FILE"
          python3 - "$SCREENS_FILE" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          source = path.read_text(encoding="utf-8")
          newline = chr(10)

          settings_start = source.find("fun SettingsScreen(")
          if settings_start < 0:
              raise SystemExit("SettingsScreen declaration not found")
          voice_marker = "val voices = speech.voiceOptions"
          voice_at = source.find(voice_marker, settings_start)
          if voice_at < 0:
              raise SystemExit("Could not locate voiceOptions in SettingsScreen")

          if "keepScreenOnWhileReading" not in source:
              line_end = source.find(newline, voice_at)
              if line_end < 0:
                  raise SystemExit("SettingsScreen voiceOptions line is malformed")
              state_line = '    var keepScreenOnWhileReading by remember { mutableStateOf(preferences.getBoolean("keep_screen_on_while_reading", true)) }' + newline
              source = source[:line_end + 1] + state_line + source[line_end + 1:]

          ui_marker = '        Text("خواندن با صدای فارسی", style = MaterialTheme.typography.titleMedium, fontWeight = FontWeight.Bold)'
          ui_block = '''        Text("مطالعه", style = MaterialTheme.typography.titleMedium, fontWeight = FontWeight.Bold)
                  OutlinedButton(
                      onClick = {
                          keepScreenOnWhileReading = !keepScreenOnWhileReading
                          preferences.edit().putBoolean("keep_screen_on_while_reading", keepScreenOnWhileReading).apply()
                      },
                      modifier = Modifier.fillMaxWidth()
                  ) {
                      Text(if (keepScreenOnWhileReading) "روشن ماندن صفحه هنگام مطالعه: فعال" else "روشن ماندن صفحه هنگام مطالعه: غیرفعال")
                  }
                  Text("این گزینه فقط هنگام باز بودن صفحهٔ مطالعه اثر می‌کند؛ با خروج از مطالعه، محدودیت روشن‌ماندن صفحه برداشته می‌شود.", style = MaterialTheme.typography.bodySmall)
          '''
          if "روشن ماندن صفحه هنگام مطالعه:" not in source:
              if source.count(ui_marker) != 1:
                  raise SystemExit("Settings UI insertion marker missing or ambiguous")
              source = source.replace(ui_marker, ui_block + ui_marker, 1)

          reader_start = source.find("fun ReaderScreen(")
          if reader_start < 0:
              raise SystemExit("ReaderScreen declaration not found")
          if "keepAwakeActivity" not in source:
              opening_brace = source.find("{", reader_start)
              if opening_brace < 0 or opening_brace - reader_start > 1200:
                  raise SystemExit("ReaderScreen opening brace not found near declaration")
              reader_code = '''
              val keepAwakeContext = androidx.compose.ui.platform.LocalContext.current
              val keepAwakeActivity = androidx.compose.runtime.remember(keepAwakeContext) {
                  var node: android.content.Context? = keepAwakeContext
                  while (node != null && node !is android.app.Activity) {
                      node = (node as? android.content.ContextWrapper)?.baseContext
                  }
                  node as? android.app.Activity
              }
              val keepAwakeEnabled = preferences.getBoolean("keep_screen_on_while_reading", true)
              androidx.compose.runtime.DisposableEffect(keepAwakeActivity, keepAwakeEnabled) {
                  val window = keepAwakeActivity?.window
                  if (keepAwakeEnabled) {
                      window?.addFlags(android.view.WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  } else {
                      window?.clearFlags(android.view.WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  }
                  onDispose {
                      window?.clearFlags(android.view.WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  }
              }
          '''
              source = source[:opening_brace + 1] + reader_code + source[opening_brace + 1:]

          path.write_text(source, encoding="utf-8")
          print("Added persistent reading-only keep-screen-on preference with lifecycle cleanup.")
          PY



      - name: Add notes export and bookmark search/delete controls
        shell: bash
        run: |
          set -euo pipefail
          SCREENS_FILE="$(find android-build/app/src/main/java -type f -name StudyScreens.kt -print -quit)"
          test -n "$SCREENS_FILE"
          python3 - "$SCREENS_FILE" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          source = path.read_text(encoding="utf-8")

          for import_line in (
              "import androidx.activity.compose.rememberLauncherForActivityResult",
              "import androidx.activity.result.contract.ActivityResultContracts",
          ):
              if import_line not in source:
                  package_end = source.find(chr(10))
                  if package_end < 0:
                      raise SystemExit("Kotlin package declaration not found")
                  source = source[:package_end + 1] + chr(10) + import_line + source[package_end + 1:]

          def replace_composable(name: str, replacement: str) -> None:
              global source
              signature = "fun " + name + "("
              at = source.find(signature)
              if at < 0:
                  raise SystemExit(name + " declaration not found")
              start = source.rfind("@Composable", 0, at)
              if start < 0:
                  raise SystemExit(name + " @Composable annotation not found")
              end = source.find(chr(10) + "@Composable", at)
              if end < 0:
                  raise SystemExit("Could not find the end boundary for " + name)
              source = source[:start] + replacement.rstrip() + chr(10) + chr(10) + source[end + 1:]

          notes_screen = r'''@Composable
          fun NotesScreen(userDb: UserDatabase) {
              val notes by userDb.noteDao().observeAll().collectAsState(initial = emptyList())
              val scope = rememberCoroutineScope()
              val context = LocalContext.current
              var showDialog by remember { mutableStateOf(false) }
              var editingId by remember { mutableStateOf<Long?>(null) }
              var title by remember { mutableStateOf("") }
              var body by remember { mutableStateOf("") }
              var query by rememberSaveable { mutableStateOf("") }
              var exportMessage by remember { mutableStateOf("") }
              val visible = notes.filter { query.isBlank() || it.title.contains(query, true) || it.body.contains(query, true) }
              val exportLauncher = rememberLauncherForActivityResult(
                  contract = ActivityResultContracts.CreateDocument("text/plain")
              ) { uri ->
                  if (uri != null) {
                      val snapshot = notes.sortedByDescending { it.updatedAt }
                      scope.launch {
                          val result = kotlinx.coroutines.withContext(kotlinx.coroutines.Dispatchers.IO) {
                              runCatching {
                                  val output = context.contentResolver.openOutputStream(uri)
                                      ?: error("امکان باز کردن فایل مقصد وجود ندارد.")
                                  output.bufferedWriter(Charsets.UTF_8).use { writer ->
                                      writer.appendLine("یادداشت‌های MindUnlock")
                                      writer.appendLine("تعداد: " + snapshot.size)
                                      writer.appendLine()
                                      snapshot.forEachIndexed { index, note ->
                                          writer.appendLine((index + 1).toString() + ". " + note.title)
                                          writer.appendLine(note.body)
                                          if (!note.chapterId.isNullOrBlank()) writer.appendLine("شناسه فصل: " + note.chapterId)
                                          if (!note.itemUid.isNullOrBlank()) writer.appendLine("شناسه مطلب: " + note.itemUid)
                                          writer.appendLine()
                                          writer.appendLine("----------------------------------------")
                                          writer.appendLine()
                                      }
                                  }
                              }
                          }
                          exportMessage = result.fold(
                              { "خروجی " + snapshot.size + " یادداشت ذخیره شد." },
                              { "ذخیرهٔ خروجی ناموفق بود: " + (it.message ?: "خطای ناشناخته") }
                          )
                      }
                  } else {
                      exportMessage = "ذخیرهٔ خروجی لغو شد."
                  }
              }

              Column(Modifier.fillMaxSize().padding(16.dp), verticalArrangement = Arrangement.spacedBy(10.dp)) {
                  Text("یادداشت‌ها · " + notes.size, style = MaterialTheme.typography.titleMedium, fontWeight = FontWeight.Bold)
                  Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                      Button(
                          onClick = { editingId = null; title = ""; body = ""; showDialog = true },
                          modifier = Modifier.weight(1f)
                      ) { Icon(Icons.Default.Add, null); Text("یادداشت جدید") }
                      OutlinedButton(
                          onClick = { exportLauncher.launch("MindUnlock-Notes.txt") },
                          enabled = notes.isNotEmpty(),
                          modifier = Modifier.weight(1f)
                      ) { Icon(Icons.Default.Download, null); Text("خروجی همه") }
                  }
                  OutlinedTextField(query, { query = it }, Modifier.fillMaxWidth(), label = { Text("جست‌وجو در یادداشت‌ها") }, singleLine = true)

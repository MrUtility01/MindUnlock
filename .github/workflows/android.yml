      - name: Move legacy migration off the Android startup thread
        shell: bash
        run: |
          set -euo pipefail
          MAIN_FILE="$(find android-build/app/src/main/java -type f -name MainActivity.kt -print -quit)"
          test -n "$MAIN_FILE"
          python3 - "$MAIN_FILE" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          source = path.read_text(encoding="utf-8")

          source = source.replace(
              "import kotlinx.coroutines.runBlocking",
              "import androidx.compose.runtime.LaunchedEffect",
              1
          )
          blocking_call = "runBlocking(Dispatchers.IO) { LegacyDatabaseMigrator.migrate(this@MainActivity, app.repository.database, userDatabase) }"
          if blocking_call not in source:
              raise SystemExit("Blocking legacy migration call not found")
          source = source.replace(blocking_call, "", 1)

          set_content_marker = "        setContent {\n"
          if set_content_marker not in source:
              raise SystemExit("MainActivity setContent marker not found")
          startup_effect = """        setContent {
                      var startupReady by remember { mutableStateOf(false) }
                      LaunchedEffect(Unit) {
                          try {
                              withContext(Dispatchers.IO) {
                                  LegacyDatabaseMigrator.migrate(this@MainActivity, app.repository.database, userDatabase)
                              }
                          } catch (error: Exception) {
                              android.util.Log.e("MindUnlockStartup", "Legacy database migration failed; continuing app startup", error)
                          } finally {
                              startupReady = true
                          }
                      }
          """
          source = source.replace(set_content_marker, startup_effect, 1)

          gate_marker = "if (!unlocked) {"
          if gate_marker not in source:
              raise SystemExit("MainActivity app-lock UI marker not found")
          startup_gate = """if (!startupReady) {
                              Column(Modifier.fillMaxSize().padding(28.dp), verticalArrangement = Arrangement.Center) {
                                  Text("MindUnlock", style = MaterialTheme.typography.headlineSmall)
                                  Text("در حال آماده‌سازی اطلاعات برنامه…")
                              }
                          } else if (!unlocked) {"""
          source = source.replace(gate_marker, startup_gate, 1)

          if "runBlocking(" in source or "import kotlinx.coroutines.runBlocking" in source:
              raise SystemExit("Blocking migration code remains in MainActivity")
          if "LaunchedEffect(Unit)" not in source or "withContext(Dispatchers.IO)" not in source or "startupReady = true" not in source:
              raise SystemExit("Non-blocking startup migration was not installed")
          path.write_text(source, encoding="utf-8")
          print("Legacy database migration now runs asynchronously; startup continues after migration errors.")
          PY
          python3 - "$MAIN_FILE" <<'PY'
          from pathlib import Path
          import sys
          source = Path(sys.argv[1]).read_text(encoding="utf-8")
          assert "runBlocking(" not in source
          assert "LaunchedEffect(Unit)" in source
          assert "withContext(Dispatchers.IO)" in source
          assert "startupReady = true" in source
          assert "else if (!unlocked)" in source
          print("Non-blocking startup assertions passed.")
          PY


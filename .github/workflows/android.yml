name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Android v0.3.3 source bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf android-build source-bundle
          mkdir -p android-build source-bundle
          SOURCE_ZIP="MindUnlock-Android-v0.3.1-source.zip"
          test -f "$SOURCE_ZIP"
          unzip -q "$SOURCE_ZIP" -d source-bundle
          SETTINGS_FILE="$(find source-bundle -type f -name settings.gradle.kts -print -quit)"
          test -n "$SETTINGS_FILE"
          ANDROID_DIR="$(dirname "$SETTINGS_FILE")"
          test -n "$ANDROID_DIR"
          cp -a "$ANDROID_DIR/." android-build/
          echo "Using Android source: $ANDROID_DIR"

          # Security UX correction: app-lock passwords accept 4+ characters.
          LOCK_FILE="$(find android-build/app/src/main/java -type f -name AppLock.kt -print -quit)"
          MAIN_FILE="$(find android-build/app/src/main/java -type f -name MainActivity.kt -print -quit)"
          SCREENS_FILE="$(find android-build/app/src/main/java -type f -name StudyScreens.kt -print -quit)"
          test -n "$LOCK_FILE" && test -n "$MAIN_FILE" && test -n "$SCREENS_FILE"
          python3 - "$LOCK_FILE" "$MAIN_FILE" "$SCREENS_FILE" <<'PY'
          from pathlib import Path
          import sys
          lock, main, screens = map(Path, sys.argv[1:])
          replacements = {
              lock: [('password.size >= 8', 'password.size >= 4'), ('حداقل ۸ نویسه', 'حداقل ۴ کاراکتر')],
              main: [('حداقل ۸ نویسه', 'حداقل ۴ کاراکتر'), ('lockPassword.length >= 8', 'lockPassword.length >= 4')],
              screens: [('حداقل ۸ نویسه', 'حداقل ۴ کاراکتر'), ('newAppPassword.length >= 8', 'newAppPassword.length >= 4')],
          }
          for path, pairs in replacements.items():
              data = path.read_text(encoding='utf-8')
              for old, new in pairs: data = data.replace(old, new)
              path.write_text(data, encoding='utf-8')
          PY

      - name: Apply uploaded portrait as Android launcher icon
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          source = Path("IMG_20261103_164024_548.jpg")
          if not source.is_file():
              raise SystemExit("Uploaded launcher portrait is missing")
          image = Image.open(source).convert("RGB")
          width, height = image.size
          side = int(min(width * 0.78, height * 0.78))
          left = max(0, min(width - side, int(width * 0.50 - side / 2)))
          top = max(0, min(height - side, int(height * 0.43 - side / 2)))
          crop = image.crop((left, top, left + side, top + side))
          sizes = {"mdpi": 48, "hdpi": 72, "xhdpi": 96, "xxhdpi": 144, "xxxhdpi": 192}
          for density, size in sizes.items():
              target = Path("android-build/app/src/main/res") / f"mipmap-{density}" / "ic_launcher.png"
              target.parent.mkdir(parents=True, exist_ok=True)
              crop.resize((size, size), Image.Resampling.LANCZOS).save(target, optimize=True)
          print("Launcher icons generated from uploaded portrait.")
          PY

      - name: Integrate offline Persian Piper TTS engine and model
        shell: bash
        run: |
          set -euo pipefail
          APP_DIR="android-build/app"
          SETTINGS="android-build/settings.gradle.kts"
          SPEECH_FILE="$(find "$APP_DIR/src/main/java" -type f -name PersianSpeech.kt -print -quit)"
          test -n "$SPEECH_FILE"
          python3 - "$SETTINGS" "$APP_DIR/build.gradle.kts" "$SPEECH_FILE" <<'PY'
          from pathlib import Path
          import sys
          settings, gradle, speech = map(Path, sys.argv[1:])
          s = settings.read_text(encoding="utf-8")
          if 'https://jitpack.io' not in s:
              s = s.replace('mavenCentral()','mavenCentral()\n        maven(url = "https://jitpack.io")')
          settings.write_text(s, encoding="utf-8")
          g = gradle.read_text(encoding="utf-8")
          dep = 'implementation("com.github.k2-fsa:sherpa-onnx:v1.13.8") { exclude(group = "com.github.k2-fsa.sherpa-onnx", module = "sherpa-onnx-jvm") }'
          if dep not in g:
              g = g.replace('dependencies {', 'dependencies {\n    ' + dep)
          g = g.replace('defaultConfig {', 'defaultConfig {\n        ndk { abiFilters += "arm64-v8a" }')
          if 'sherpa-onnx/native/**' not in g:
              g = g.replace('packaging {', 'packaging {\n        resources.excludes += "sherpa-onnx/native/**"\n        ')
          gradle.write_text(g, encoding="utf-8")
          speech.write_text(r'''package com.mindunlock.app

          import android.content.Context
          import android.media.AudioAttributes
          import android.media.AudioFormat
          import android.media.AudioTrack
          import android.speech.tts.Voice
          import androidx.compose.runtime.mutableStateOf
          import com.k2fsa.sherpa.onnx.OfflineTts
          import com.k2fsa.sherpa.onnx.OfflineTtsConfig
          import com.k2fsa.sherpa.onnx.OfflineTtsModelConfig
          import com.k2fsa.sherpa.onnx.OfflineTtsVitsModelConfig
          import java.io.File
          import java.util.concurrent.Executors
          import kotlin.concurrent.thread

          class PersianSpeech(context: Context) {
              private val appContext = context.applicationContext
              private val executor = Executors.newSingleThreadExecutor()
              @Volatile private var tts: OfflineTts? = null
              @Volatile private var audioTrack: AudioTrack? = null
              val ready = mutableStateOf(false)
              val error = mutableStateOf<String?>(null)
              val status = mutableStateOf("در حال آماده‌سازی موتور عصبی فارسی…")
              val voices = mutableStateOf<List<Voice>>(emptyList())

              init {
                  thread(name = "piper-fa-init") {
                      try {
                          val root = File(appContext.filesDir, "piper-fa")
                          val modelDir = File(root, "vits-piper-fa_IR-gyro-medium")
                          val espeakDir = File(modelDir, "espeak-ng-data")
                          copyAssetTree("vits-piper-fa_IR-gyro-medium", modelDir)
                          val model = File(modelDir, "fa_IR-gyro-medium.onnx")
                          val tokens = File(modelDir, "tokens.txt")
                          check(model.isFile && model.length() > 1_000_000L) { "فایل مدل صوتی فارسی ناقص است." }
                          check(tokens.isFile && espeakDir.isDirectory) { "فایل‌های زبان فارسی ناقص هستند." }
                          val config = OfflineTtsConfig(
                              model = OfflineTtsModelConfig(
                                  vits = OfflineTtsVitsModelConfig(
                                      model = model.absolutePath,
                                      tokens = tokens.absolutePath,
                                      dataDir = espeakDir.absolutePath
                                  ),
                                  numThreads = 2,
                                  debug = false,
                                  provider = "cpu"
                              )
                          )
                          val engine = OfflineTts(config = config)
                          check(engine.numSpeakers() > 0) { "مدل فارسی هیچ گوینده‌ای ارائه نکرد." }
                          tts = engine
                          ready.value = true
                          error.value = null
                          status.value = "موتور آفلاین Piper فارسی آماده است."
                      } catch (t: Throwable) {
                          error.value = "راه‌اندازی موتور فارسی ناموفق بود: ${t.message ?: t.javaClass.simpleName}"
                          status.value = error.value!!
                      }
                  }
              }

              private fun copyAssetTree(assetPath: String, target: File) {
                  val children = appContext.assets.list(assetPath).orEmpty()
                  if (children.isEmpty()) {
                      // A leaf in Android assets is a FILE, never create a directory at its path.
                      if (target.isFile && target.length() > 0L) return
                      target.parentFile?.mkdirs()
                      appContext.assets.open(assetPath).use { input ->
                          target.outputStream().use { output -> input.copyTo(output) }
                      }
                  } else {
                      if (target.exists() && !target.isDirectory) {
                          target.delete()
                      }
                      target.mkdirs()
                      children.forEach { child ->
                          copyAssetTree("$assetPath/$child", File(target, child))
                      }
                  }
              }

              fun speak(text: String, speed: Float = 1f, voiceName: String? = null) {
                  if (text.isBlank()) return
                  val engine = tts
                  if (engine == null) {
                      error.value = "موتور فارسی هنوز آماده نیست."
                      status.value = error.value!!
                      return
                  }
                  stop()
                  error.value = null
                  status.value = "در حال تولید صدای فارسی به‌صورت آفلاین…"
                  executor.execute {
                      try {
                          val audio = engine.generate(text = text, sid = 0, speed = speed.coerceIn(0.75f, 1.35f))
                          check(audio.samples.isNotEmpty()) { "مدل خروجی صوتی تولید نکرد." }
                          val minBuffer = AudioTrack.getMinBufferSize(
                              audio.sampleRate, AudioFormat.CHANNEL_OUT_MONO, AudioFormat.ENCODING_PCM_FLOAT
                          ).coerceAtLeast(audio.samples.size * 4)
                          val track = AudioTrack.Builder()
                              .setAudioAttributes(AudioAttributes.Builder()
                                  .setUsage(AudioAttributes.USAGE_MEDIA)
                                  .setContentType(AudioAttributes.CONTENT_TYPE_SPEECH).build())
                              .setAudioFormat(AudioFormat.Builder()
                                  .setSampleRate(audio.sampleRate)
                                  .setChannelMask(AudioFormat.CHANNEL_OUT_MONO)
                                  .setEncoding(AudioFormat.ENCODING_PCM_FLOAT).build())
                              .setBufferSizeInBytes(minBuffer)
                              .setTransferMode(AudioTrack.MODE_STATIC)
                              .build()
                          audioTrack = track
                          track.write(audio.samples, 0, audio.samples.size, AudioTrack.WRITE_BLOCKING)
                          track.play()
                          status.value = "صدای فارسی در حال پخش است."
                          while (track.playState == AudioTrack.PLAYSTATE_PLAYING &&
                              track.playbackHeadPosition < audio.samples.size) Thread.sleep(80)
                          track.release()
                          if (audioTrack === track) audioTrack = null
                          status.value = "خواندن فارسی با موتور Piper تمام شد."
                      } catch (t: Throwable) {
                          error.value = "خطا در تولید یا پخش صدای فارسی: ${t.message ?: t.javaClass.simpleName}"
                          status.value = error.value!!
                      }
                  }
              }

              fun stop() {
                  try { audioTrack?.pause(); audioTrack?.flush(); audioTrack?.release() } catch (_: Throwable) {}
                  audioTrack = null
                  status.value = "پخش متوقف شد."
              }

              fun close() {
                  stop()
                  executor.shutdownNow()
                  try { tts?.release() } catch (_: Throwable) {}
                  tts = null
              }
          }
          ''', encoding="utf-8")
          PY

          echo "Persian voice models will be downloaded on demand after installation."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create Gradle Wrapper
        working-directory: android-build
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/disable-wrapper-url-validation.gradle <<'GRADLE'
          allprojects {
              tasks.withType(org.gradle.api.tasks.wrapper.Wrapper).configureEach {
                  validateDistributionUrl = false
              }
          }
          GRADLE
          gradle -I /tmp/disable-wrapper-url-validation.gradle wrapper --gradle-version 8.9 --distribution-type bin
          chmod +x gradlew

      - name: Replace Android system TTS controls with in-app Piper manager
        shell: bash
        run: |
          set -euo pipefail
          SCREENS_FILE="$(find android-build/app/src/main/java -type f -name StudyScreens.kt -print -quit)"
          test -n "$SCREENS_FILE"
          python3 - "$SCREENS_FILE" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          s = p.read_text(encoding="utf-8")
          old = '''        OutlinedButton(onClick = { expanded = true }, modifier = Modifier.fillMaxWidth()) { Text(voices.firstOrNull { it.name == voiceName }?.name ?: "انتخاب صدای فارسی") }
                  DropdownMenu(expanded = expanded, onDismissRequest = { expanded = false }) {
                      voices.forEach { voice -> DropdownMenuItem(text = { Text(voice.name) }, onClick = { voiceName = voice.name; preferences.edit().putString("speech_voice", voice.name).apply(); expanded = false }) }
                  }
                  if (voices.isEmpty()) Text("اگر صدای فارسی در فهرست نیست، در تنظیمات گوشی به Text-to-speech برو و دادهٔ زبان فارسی را نصب کن. برای کار آفلاین، موتور باید بستهٔ صوتی محلی داشته باشد.", style = MaterialTheme.typography.bodySmall)'''
          new = '''        Card(Modifier.fillMaxWidth()) {
                      Column(Modifier.padding(12.dp), verticalArrangement = Arrangement.spacedBy(6.dp)) {
                          Text("موتور گفتار: Piper فارسی (Gyro Medium)", fontWeight = FontWeight.SemiBold)
                          Text("مدل صوتی داخل برنامه نگهداری می‌شود و برای تولید گفتار به موتور TTS اندروید یا اینترنت وابسته نیست.", style = MaterialTheme.typography.bodySmall)
                          Text(if (speech.ready.value) "وضعیت: آماده" else "وضعیت: در حال بارگذاری یا دارای خطا", style = MaterialTheme.typography.bodySmall)
                      }
                  }'''
          if old not in s:
              raise SystemExit("Expected legacy TTS voice selector block not found; refusing unsafe partial edit")
          s = s.replace(old, new, 1)
          old2 = '''        OutlinedButton(onClick = { runCatching { context.startActivity(Intent("android.speech.tts.engine.INSTALL_TTS_DATA").addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)) } }, modifier = Modifier.fillMaxWidth()) { Text("مدیریت / نصب داده‌های گفتار گوشی") }'''
          new2 = '''        OutlinedButton(onClick = { speech.stop() }, modifier = Modifier.fillMaxWidth()) { Text("توقف موتور گفتار") }'''
          if old2 not in s:
              raise SystemExit("Expected Android TTS settings action not found; refusing unsafe partial edit")
          s = s.replace(old2, new2, 1)
          p.write_text(s, encoding="utf-8")
          PY

      - name: Apply study workflow and UI redesign
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .github/refactor_android.py.xz.b64 | xz -d > /tmp/refactor_android.py
          MAIN_FILE="$(find android-build/app/src/main/java -type f -name MainActivity.kt -print -quit)"
          test -n "$MAIN_FILE"
          PACKAGE_DIR="$(dirname "$MAIN_FILE")"
          python3 /tmp/refactor_android.py "$PACKAGE_DIR"
          SCREENS_FILE="$(find "$PACKAGE_DIR" -type f -name StudyScreens.kt -print -quit)"
          test -n "$SCREENS_FILE"
          # The Android baseline does not bundle the extended FlashOn vector.
          # Reuse the already imported PlayArrow icon to keep dependencies lean.
          sed -i 's/FlashOn/PlayArrow/g' "$SCREENS_FILE"

      - name: Apply database split, on-demand voices and sync optimizations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, lzma
          from pathlib import Path
          encoded = Path(".github/mindunlock_optimization.py.xz.b64").read_text(encoding="ascii") + Path(".github/mindunlock_optimization_part2.b64").read_text(encoding="ascii")
          Path("/tmp/mindunlock_optimization.py").write_bytes(lzma.decompress(base64.b64decode(encoded)))
          PY
          MAIN_FILE="$(find android-build/app/src/main/java -type f -name MainActivity.kt -print -quit)"
          test -n "$MAIN_FILE"
          PACKAGE_DIR="$(dirname "$MAIN_FILE")"
          python3 /tmp/mindunlock_optimization.py "$PACKAGE_DIR"
          sed -i 's/versionCode = 3/versionCode = 6/; s/versionName = "0.3.1"/versionName = "0.5.1"/' android-build/app/build.gradle.kts
          python3 - "$PACKAGE_DIR" <<'PY'
          from pathlib import Path
          import sys
          package = Path(sys.argv[1])
          speech = package / "PersianSpeech.kt"
          source = speech.read_text(encoding="utf-8")
          old = '''    init {
                  val saved = appContext.getSharedPreferences("mindunlock_preferences", Context.MODE_PRIVATE).getString("speech_voice", "gyro") ?: "gyro"
                  selectVoice(saved)
              }'''
          new = '''    init {
                  val saved = appContext.getSharedPreferences("mindunlock_preferences", Context.MODE_PRIVATE).getString("speech_voice", "gyro") ?: "gyro"
                  activeId = saved
                  activeVoice.value = saved
              }'''
          if old not in source:
              raise SystemExit("Could not make speech model download fully on-demand")
          source = source.replace(old, new, 1)
          marker = "    fun speak(text: String, speed: Float = 1f, voiceName: String? = null) {"
          delete_method = '''    fun deleteDownloadedVoice(id: String) {
                  val target = voiceOptions.firstOrNull { it.first == id }?.first ?: return
                  if (loadedId == target) {
                      stop()
                      try { tts?.release() } catch (_: Throwable) {}
                      tts = null
                      loadedId = null
                      ready.value = false
                  }
                  val folder = File(appContext.filesDir, "speech/${spec(target).directory}")
                  folder.deleteRecursively()
                  status.value = "مدل صوتی انتخاب‌شده از حافظهٔ برنامه حذف شد."
              }

          '''
          if marker not in source:
              raise SystemExit("Speech method insertion point not found")
          source = source.replace(marker, delete_method + marker, 1)
          speech.write_text(source, encoding="utf-8")
          screens = package / "ui" / "StudyScreens.kt"
          ui = screens.read_text(encoding="utf-8")
          ui = ui.replace('    LaunchedEffect(voiceName) { speech.selectVoice(voiceName ?: "gyro") }', '')
          ui = ui.replace('Card(onClick = { voiceName = voice.first; preferences.edit().putString("speech_voice", voice.first).apply() }',
                          'Card(onClick = { voiceName = voice.first; preferences.edit().putString("speech_voice", voice.first).apply(); speech.selectVoice(voice.first) }')
          ui = ui.replace('onClick = { voiceName = voice.first; preferences.edit().putString("speech_voice", voice.first).apply() })',
                          'onClick = { voiceName = voice.first; preferences.edit().putString("speech_voice", voice.first).apply(); speech.selectVoice(voice.first) })')
          ui = ui.replace('''        HorizontalDivider()
                  Text("امنیت برنامه"''','''        OutlinedButton(onClick = { speech.deleteDownloadedVoice(voiceName ?: "gyro") }, modifier = Modifier.fillMaxWidth()) { Text("حذف مدل صوتی انتخاب‌شده از حافظه") }
                  HorizontalDivider()
                  Text("امنیت برنامه"''')
          screens.write_text(ui, encoding="utf-8")
          # Progressive chapter loading: only fetch the first 100 chapter records initially.
          dao = package / "data" / "local" / "AppDatabase.kt"
          d = dao.read_text(encoding="utf-8")
          if "observeForChapterPage" not in d:
              needle = '    fun observeForChapter(chapterId: String): Flow<List<ContentItemEntity>>'
              if needle not in d: raise SystemExit("Chapter DAO paging insertion point not found")
              d = d.replace(needle, needle + '\n\n    @Query("SELECT * FROM content_items WHERE chapterId = :chapterId ORDER BY orderIndex, title LIMIT :limit OFFSET :offset")\n    fun observeForChapterPage(chapterId: String, limit: Int, offset: Int): Flow<List<ContentItemEntity>>', 1)
              dao.write_text(d, encoding="utf-8")
          ui = screens.read_text(encoding="utf-8")
          old_line = '    val items by db.contentItemDao().observeForChapter(chapterId).collectAsState(initial = emptyList())'
          new_lines = '''    var page by rememberSaveable(chapterId) { mutableIntStateOf(1) }
              val pageLimit = page * 100
              val items by db.contentItemDao().observeForChapterPage(chapterId, pageLimit, 0).collectAsState(initial = emptyList())'''
          if old_line not in ui: raise SystemExit("Chapter content page-load insertion point not found")
          ui = ui.replace(old_line, new_lines, 1)
          item_line = '            items(visible, key = { it.uid }) { item -> ContentItemCard(item, onClick = { onItemClick(item.uid) }) }'
          load_more = item_line + '\n            if (items.size == pageLimit) item { TextButton(onClick = { page += 1 }, modifier = Modifier.fillMaxWidth()) { Text("بارگذاری ۱۰۰ مطلب بعدی") } }'
          if item_line not in ui: raise SystemExit("Chapter content load-more insertion point not found")
          ui = ui.replace(item_line, load_more, 1)
          # Explicit cancellation control for chapter synchronization.
          ui = ui.replace('    var busy by remember { mutableStateOf(false) }', '    var busy by remember { mutableStateOf(false) }\n    var syncJob by remember { mutableStateOf<kotlinx.coroutines.Job?>(null) }', 1)
          old_launch = '                scope.launch {\n                    val result = runCatching {\n                        repository.syncSelected'
          if old_launch not in ui: raise SystemExit("Sync job insertion point not found")
          ui = ui.replace(old_launch, '                syncJob = scope.launch {\n                    val result = runCatching {\n                        repository.syncSelected', 1)
          old_end = '                    busy = false\n                }\n            }, modifier = Modifier.fillMaxWidth()) { Text("دانلود فصل‌های انتخاب‌شده") }'
          if old_end not in ui: raise SystemExit("Sync job completion insertion point not found")
          ui = ui.replace(old_end, '                    busy = false\n                    syncJob = null\n                }\n            }, modifier = Modifier.fillMaxWidth()) { Text("دانلود فصل‌های انتخاب‌شده") }', 1)
          cancel_anchor = '                Text(progressText, style = MaterialTheme.typography.bodySmall)\n            }\n            OutlinedButton(onClick = onDone'
          if cancel_anchor not in ui: raise SystemExit("Sync cancel button insertion point not found")
          ui = ui.replace(cancel_anchor, '                Text(progressText, style = MaterialTheme.typography.bodySmall)\n            }\n            if (busy && syncJob != null) OutlinedButton(onClick = { syncJob?.cancel(); message = "درخواست لغو همگام‌سازی ارسال شد." }, modifier = Modifier.fillMaxWidth()) { Text("لغو همگام‌سازی") }\n            OutlinedButton(onClick = onDone', 1)
          screens.write_text(ui, encoding="utf-8")
          # Check cancellation between chapter downloads instead of finishing the full queue.
          sync = package / "data" / "repository" / "SyncRepository.kt"
          source = sync.read_text(encoding="utf-8")
          if "import kotlinx.coroutines.currentCoroutineContext" not in source:
              source = source.replace("import kotlinx.coroutines.Dispatchers", "import kotlinx.coroutines.Dispatchers\nimport kotlinx.coroutines.currentCoroutineContext\nimport kotlinx.coroutines.ensureActive", 1)
          source = source.replace('''        selected.forEachIndexed { index, chapter ->
                      withContext(Dispatchers.Main)''','''        selected.forEachIndexed { index, chapter ->
                      currentCoroutineContext().ensureActive()
                      withContext(Dispatchers.Main)''', 1)
          sync.write_text(source, encoding="utf-8")
          PY

      - name: Harden Persian voice downloads and expand voice management settings
        shell: bash
        run: |
          set -euo pipefail
          MAIN_FILE="$(find android-build/app/src/main/java -type f -name MainActivity.kt -print -quit)"
          test -n "$MAIN_FILE"
          PACKAGE_DIR="$(dirname "$MAIN_FILE")"
          python3 - "$PACKAGE_DIR" <<'PY'
          from pathlib import Path
          import re, sys

          package = Path(sys.argv[1])
          speech = package / "PersianSpeech.kt"
          source = speech.read_text(encoding="utf-8")
          source = source.replace(
              "private data class ModelSpec(val archive: String, val directory: String, val model: String)",
              "private data class ModelSpec(val archive: String, val directory: String, val model: String, val archiveBytes: Long)"
          )
          replacements = {
              'vits-piper-fa_IR-amir-medium.tar.bz2", "vits-piper-fa_IR-amir-medium", "fa_IR-amir-medium.onnx")':
              'vits-piper-fa_IR-amir-medium.tar.bz2", "vits-piper-fa_IR-amir-medium", "fa_IR-amir-medium.onnx", 67180373L)',
              'vits-mimic3-fa-haaniye_low.tar.bz2", "vits-mimic3-fa-haaniye_low", "fa-haaniye_low.onnx")':
              'vits-mimic3-fa-haaniye_low.tar.bz2", "vits-mimic3-fa-haaniye_low", "fa-haaniye_low.onnx", 67093314L)',
              'vits-piper-fa_IR-gyro-medium.tar.bz2", "vits-piper-fa_IR-gyro-medium", "fa_IR-gyro-medium.onnx")':
              'vits-piper-fa_IR-gyro-medium.tar.bz2", "vits-piper-fa_IR-gyro-medium", "fa_IR-gyro-medium.onnx", 67183308L)',
          }
          for old, new in replacements.items():
              if old not in source: raise SystemExit("Expected voice model metadata not found: " + old)
              source = source.replace(old, new, 1)

          if "val downloadProgress = mutableStateOf(0f)" not in source:
              source = source.replace(
                  '    val loading = mutableStateOf(false)\n',
                  '    val loading = mutableStateOf(false)\n    val downloadProgress = mutableStateOf(0f)\n    val downloadedBytes = mutableStateOf(0L)\n',
                  1
              )

          if "fun isVoiceDownloaded(id: String)" not in source:
              marker = "    private fun buildEngine(id: String): OfflineTts {"
              method = '''    fun isVoiceDownloaded(id: String): Boolean {
                  val modelSpec = spec(id)
                  val dir = File(appContext.filesDir, "speech/" + modelSpec.directory)
                  return File(dir, modelSpec.model).let { it.isFile && it.length() > 1_000_000L } &&
                      File(dir, "tokens.txt").isFile && File(dir, "espeak-ng-data").isDirectory
              }

          '''
              if marker not in source: raise SystemExit("buildEngine insertion point not found")
              source = source.replace(marker, method + marker, 1)

          new_method = r'''    private fun downloadAndExtract(spec: ModelSpec, destination: File) {
                  val archive = File(appContext.cacheDir, spec.directory + ".tar.bz2")
                  val partial = File(appContext.cacheDir, spec.directory + ".tar.bz2.part")
                  archive.delete()
                  partial.delete()
                  downloadProgress.value = 0f
                  downloadedBytes.value = 0L
                  status.value = "در حال اتصال به سرور دریافت مدل…"
                  val connection = (URL(spec.archive).openConnection() as HttpURLConnection).apply {
                      connectTimeout = 30000
                      readTimeout = 180000
                      instanceFollowRedirects = true
                      requestMethod = "GET"
                      setRequestProperty("User-Agent", "MindUnlock-Android/0.5.2")
                      setRequestProperty("Accept", "application/octet-stream")
                  }
                  try {
                      val response = connection.responseCode
                      check(response == HttpURLConnection.HTTP_OK) {
                          "سرور دریافت مدل پاسخ HTTP " + response + " داد."
                      }
                      val expectedLength = connection.contentLength.toLong()
                      check(expectedLength == spec.archiveBytes) {
                          "حجم بسته با نسخهٔ معتبر مدل مطابقت ندارد (HTTP=" + expectedLength + "، expected=" + spec.archiveBytes + ")."
                      }
                      status.value = "در حال دریافت بستهٔ صدای فارسی…"
                      var received = 0L
                      connection.inputStream.use { input ->
                          partial.outputStream().buffered().use { output ->
                              val buffer = ByteArray(64 * 1024)
                              while (true) {
                                  val count = input.read(buffer)
                                  if (count < 0) break
                                  output.write(buffer, 0, count)
                                  received += count
                                  downloadedBytes.value = received
                                  downloadProgress.value = (received.toFloat() / expectedLength.toFloat()).coerceIn(0f, 1f)
                              }
                          }
                      }
                      check(received == expectedLength && partial.length() == spec.archiveBytes) {
                          "دانلود کامل نشد؛ " + received + " از " + expectedLength + " بایت دریافت شد."
                      }
                      check(partial.renameTo(archive)) { "ذخیرهٔ بستهٔ دانلودشده ناموفق بود." }
                  } catch (e: Throwable) {
                      partial.delete()
                      archive.delete()
                      throw IllegalStateException("دانلود مدل ناموفق بود: " + (e.message ?: e.javaClass.simpleName), e)
                  } finally {
                      connection.disconnect()
                  }

                  status.value = "در حال بررسی و استخراج مدل گفتار…"
                  val root = File(appContext.filesDir, "speech-staging").apply { mkdirs() }.canonicalFile
                  val extracted = File(root, spec.directory)
                  extracted.deleteRecursively()
                  try {
                      TarArchiveInputStream(BZip2CompressorInputStream(BufferedInputStream(FileInputStream(archive)))).use { tar ->
                          var entry = tar.nextTarEntry
                          while (entry != null) {
                              val out = File(root, entry.name).canonicalFile
                              check(out.path.startsWith(root.path + File.separator)) { "مسیر ناامن در بستهٔ مدل." }
                              if (entry.isDirectory) out.mkdirs() else {
                                  out.parentFile?.mkdirs()
                                  out.outputStream().use { tar.copyTo(it) }
                              }
                              entry = tar.nextTarEntry
                          }
                      }
                      check(File(extracted, spec.model).let { it.isFile && it.length() > 1_000_000L } &&
                          File(extracted, "tokens.txt").isFile && File(extracted, "espeak-ng-data").isDirectory) {
                          "ساختار بسته معتبر نیست یا فایل‌های مدل و زبان ناقص هستند."
                      }

                      destination.parentFile?.mkdirs()
                      val stagedInstall = File(destination.parentFile, "." + destination.name + ".installing")
                      val backup = File(destination.parentFile, "." + destination.name + ".backup")
                      stagedInstall.deleteRecursively()
                      backup.deleteRecursively()
                      check(extracted.renameTo(stagedInstall)) { "آماده‌سازی پوشهٔ نصب مدل ناموفق بود." }
                      if (destination.exists()) check(destination.renameTo(backup)) { "امکان جایگزینی مدل قبلی وجود ندارد." }
                      if (!stagedInstall.renameTo(destination)) {
                          if (backup.exists()) backup.renameTo(destination)
                          throw IllegalStateException("انتقال مدل به پوشهٔ نهایی ناموفق بود.")
                      }
                      backup.deleteRecursively()
                      archive.delete()
                      downloadProgress.value = 1f
                      status.value = "مدل با موفقیت نصب و اعتبارسنجی شد."
                  } catch (e: Throwable) {
                      throw IllegalStateException("نصب مدل ناموفق بود: " + (e.message ?: e.javaClass.simpleName), e)
                  } finally {
                      root.deleteRecursively()
                  }
              }

          '''
          pattern = r"    private fun downloadAndExtract\(spec: ModelSpec, destination: File\) \{.*?\n    \}\n\n    fun deleteDownloadedVoice"
          match = re.search(pattern, source, flags=re.S)
          if not match: raise SystemExit("Existing downloadAndExtract method not found; refusing unsafe rewrite")
          source = source[:match.start()] + new_method + "    fun deleteDownloadedVoice" + source[match.end():]
          speech.write_text(source, encoding="utf-8")

          screens = package / "ui" / "StudyScreens.kt"
          ui = screens.read_text(encoding="utf-8")
          if "speech.isVoiceDownloaded(voice.first)" not in ui:
              old = 'Column(Modifier.weight(1f)) { Text(voice.second, fontWeight = FontWeight.SemiBold); Text(if (voice.first == "haaniye") "زن · مدل مستقل فارسی" else "مرد · مدل مستقل فارسی", style = MaterialTheme.typography.labelSmall) }'
              new = '''Column(Modifier.weight(1f)) {
                              Text(voice.second, fontWeight = FontWeight.SemiBold)
                              Text(if (voice.first == "haaniye") "زن · مدل مستقل فارسی" else "مرد · مدل مستقل فارسی", style = MaterialTheme.typography.labelSmall)
                              Text(if (speech.isVoiceDownloaded(voice.first)) "مدل نصب شده" else "مدل هنوز نصب نشده", style = MaterialTheme.typography.labelSmall, color = if (speech.isVoiceDownloaded(voice.first)) MaterialTheme.colorScheme.primary else MaterialTheme.colorScheme.onSurfaceVariant)
                          }'''
              if old not in ui: raise SystemExit("Voice card status insertion point not found")
              ui = ui.replace(old, new, 1)

          if "speech.downloadProgress.value" not in ui:
              old = '        Text(speech.status.value, style = MaterialTheme.typography.bodySmall)\n        speech.error.value?.let'
              new = '''        Text(speech.status.value, style = MaterialTheme.typography.bodySmall)
                  if (speech.loading.value) {
                      LinearProgressIndicator(progress = speech.downloadProgress.value, modifier = Modifier.fillMaxWidth())
                      Text("دریافت‌شده: " + String.format(Locale.US, "%.1f", speech.downloadedBytes.value / (1024f * 1024f)) + " مگابایت", style = MaterialTheme.typography.labelSmall)
                  }
                  speech.error.value?.let'''
              if old not in ui: raise SystemExit("Voice progress UI insertion point not found")
              ui = ui.replace(old, new, 1)
          screens.write_text(ui, encoding="utf-8")
          print("Hardened model downloads and added per-voice installation status and progress.")
          PY


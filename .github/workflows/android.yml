name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare full native Android v0.3.0 source bundle
        run: |
          rm -rf android-build source-bundle
          mkdir -p android-build source-bundle
          if [ -f "MindUnlock-Android-v0.3.0-main-deploy (1).zip" ]; then
            unzip -q "MindUnlock-Android-v0.3.0-main-deploy (1).zip" -d source-bundle
            cp -a source-bundle/android/. android-build/
            echo "Using complete native Android source bundle v0.3.0"
          else
            echo "::error::Complete Android source bundle missing from repository"
            exit 1
          fi
          echo "=== Android source tree ==="
          find android-build -type f | sort

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create Gradle Wrapper
        working-directory: android-build
        run: |
          gradle wrapper --gradle-version 8.9
          chmod +x gradlew

      - name: Build Debug APK
        working-directory: android-build
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MindUnlock-Android-v0.3.0-debug
          path: android-build/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish GitHub Release with APK
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v0.3.0-${{ github.run_number }}
          name: MindUnlock Android 0.3.0 (#${{ github.run_number }})
          body: |
            Android Native 0.3.0 test build.
            Minimum Android 8.0. HTTP sync is intended for trusted local networks only.
          files: android-build/app/build/outputs/apk/debug/app-debug.apk
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

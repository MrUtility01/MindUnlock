      - name: Add in-app crash diagnostics and report sharing
        shell: bash
        run: |
          set -euo pipefail
          MAIN_FILE="$(find android-build/app/src/main/java -type f -name MainActivity.kt -print -quit)"
          SCREENS_FILE="$(find android-build/app/src/main/java -type f -name StudyScreens.kt -print -quit)"
          test -n "$MAIN_FILE" && test -n "$SCREENS_FILE"
          PACKAGE_DIR="$(dirname "$MAIN_FILE")"
          python3 - "$MAIN_FILE" "$SCREENS_FILE" "$PACKAGE_DIR" <<'PY'
          from pathlib import Path
          import sys
          main_path, screens_path, package_dir = map(Path, sys.argv[1:])
          main = main_path.read_text(encoding="utf-8")
          screens = screens_path.read_text(encoding="utf-8")
          diagnostics = """package com.mindunlock.app
          import android.content.Context
          import android.content.Intent
          import android.os.Build
          import java.io.File
          import java.io.PrintWriter
          import java.io.StringWriter
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale
          import kotlin.system.exitProcess

          object CrashDiagnostics {
              @Volatile private var currentScreen = "MainActivity"
              @Volatile private var installed = false

              fun setCurrentScreen(value: String) { currentScreen = value.take(160) }

              @Synchronized fun install(context: Context) {
                  if (installed) return
                  installed = true
                  val app = context.applicationContext
                  val previous = Thread.getDefaultUncaughtExceptionHandler()
                  Thread.setDefaultUncaughtExceptionHandler { thread, error ->
                      try {
                          val folder = File(app.filesDir, "diagnostics")
                          folder.mkdirs()
                          val version = runCatching {
                              app.packageManager.getPackageInfo(app.packageName, 0).versionName ?: "unknown"
                          }.getOrDefault("unknown")
                          val trace = StringWriter()
                          error.printStackTrace(PrintWriter(trace))
                          val report = buildString {
                              appendLine("MindUnlock crash report")
                              appendLine("Time: " + SimpleDateFormat("yyyy-MM-dd HH:mm:ss Z", Locale.US).format(Date()))
                              appendLine("App version: " + version)
                              appendLine("Package: " + app.packageName)
                              appendLine("Android: " + Build.VERSION.RELEASE + " (API " + Build.VERSION.SDK_INT + ")")
                              appendLine("Device: " + Build.MANUFACTURER + " " + Build.MODEL)
                              appendLine("Thread: " + thread.name)
                              appendLine("Screen: " + currentScreen)
                              appendLine()
                              append(trace.toString())
                          }
                          File(folder, "last-crash.txt").writeText(report, Charsets.UTF_8)
                      } catch (_: Throwable) { }
                      if (previous != null) previous.uncaughtException(thread, error)
                      else {
                          android.os.Process.killProcess(android.os.Process.myPid())
                          exitProcess(10)
                      }
                  }
              }

              fun readLastReport(context: Context): String =
                  runCatching {
                      File(context.filesDir, "diagnostics/last-crash.txt")
                          .takeIf { it.isFile }?.readText(Charsets.UTF_8).orEmpty()
                  }.getOrDefault("")

              fun shareLastReport(context: Context) {
                  val report = readLastReport(context)
                  val text = if (report.isBlank()) "هنوز گزارش کرشی از MindUnlock ثبت نشده است." else report
                  val send = Intent(Intent.ACTION_SEND).apply {
                      type = "text/plain"
                      putExtra(Intent.EXTRA_SUBJECT, "MindUnlock crash diagnostics")
                      putExtra(Intent.EXTRA_TEXT, text)
                      addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                  }
                  context.startActivity(Intent.createChooser(send, "ارسال گزارش عیب‌یابی").addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
              }
          }
          """
          (package_dir / "CrashDiagnostics.kt").write_text(diagnostics, encoding="utf-8")

          if "CrashDiagnostics.install(this)" not in main:
              marker = "super.onCreate(savedInstanceState)"
              if main.count(marker) != 1:
                  raise SystemExit("MainActivity onCreate marker not unique")
              main = main.replace(marker, marker + chr(10) + "        CrashDiagnostics.install(this)", 1)
          main_path.write_text(main, encoding="utf-8")

          if "import com.mindunlock.app.CrashDiagnostics" not in screens:
              package_end = screens.find(chr(10))
              screens = screens[:package_end + 1] + chr(10) + "import com.mindunlock.app.CrashDiagnostics" + screens[package_end + 1:]
          signature = "fun SettingsScreen("
          start_at = screens.find(signature)
          if start_at < 0:
              raise SystemExit("SettingsScreen declaration missing")
          opening = screens.find("{", start_at)
          if opening < 0 or opening - start_at > 1400:
              raise SystemExit("SettingsScreen body boundary missing")
          if "var crashReportPreview by remember" not in screens:
              screens = screens[:opening + 1] + chr(10) + "    var crashReportPreview by remember { mutableStateOf(\"\") }" + chr(10) + "    val diagnosticContext = LocalContext.current" + screens[opening + 1:]
          marker = 'Text("۷. درباره برنامه و عیب‌یابی",'
          if marker not in screens:
              raise SystemExit("Settings diagnostics section marker missing")
          if "گزارش آخرین کرش" not in screens:
              block = """Text("گزارش آخرین کرش", style = MaterialTheme.typography.titleSmall, fontWeight = FontWeight.SemiBold)
                          Text("خطاهای برنامه به‌صورت محلی ذخیره می‌شوند؛ گزارش شامل زمان، نسخه اندروید، دستگاه و Stack trace است.", style = MaterialTheme.typography.bodySmall)
                          Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                              OutlinedButton(onClick = { crashReportPreview = CrashDiagnostics.readLastReport(diagnosticContext) }, modifier = Modifier.weight(1f)) { Text("بررسی گزارش ذخیره‌شده") }
                              OutlinedButton(onClick = { CrashDiagnostics.shareLastReport(diagnosticContext) }, modifier = Modifier.weight(1f)) { Text("ارسال / اشتراک گزارش") }
                          }
                          if (crashReportPreview.isNotBlank()) {
                              Text(crashReportPreview.takeLast(5000), style = MaterialTheme.typography.bodySmall, maxLines = 14, overflow = androidx.compose.ui.text.style.TextOverflow.Ellipsis)
                          }
                          """
              screens = screens.replace(marker, block + marker, 1)
          screens_path.write_text(screens, encoding="utf-8")
          assert "CrashDiagnostics.install(this)" in main
          assert "گزارش آخرین کرش" in screens
          print("Crash capture, local report preview and share sheet integrated.")
          PY

      - name: Harden lesson opening, image decoding and crash diagnostics
        shell: bash
        run: |
          set -euo pipefail
          MAIN_FILE="$(find android-build/app/src/main/java -type f -name MainActivity.kt -print -quit)"
          SCREENS_FILE="$(find android-build/app/src/main/java -type f -name StudyScreens.kt -print -quit)"
          test -n "$MAIN_FILE" && test -n "$SCREENS_FILE"
          PACKAGE_DIR="$(dirname "$MAIN_FILE")"
          python3 - "$MAIN_FILE" "$SCREENS_FILE" "$PACKAGE_DIR/CrashDiagnostics.kt" <<'PY'
          from pathlib import Path

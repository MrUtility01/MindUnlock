              "import androidx.compose.ui.Modifier",
              "import androidx.compose.ui.platform.LocalContext",
              "import androidx.compose.ui.text.font.FontWeight",
              "import androidx.compose.ui.text.input.PasswordVisualTransformation",
              "import androidx.compose.ui.unit.dp",
          ]
          lines = source.splitlines()
          for item in required_imports:
              if item not in lines:
                  lines.insert(1, item)
          screens_path.write_text("\n".join(lines) + "\n", encoding="utf-8")

          main = main_path.read_text(encoding="utf-8")
          old_call = '"settings" -> SettingsScreen(speech, preferences, initialTheme, onThemeChange, onFontScaleChange)'
          new_call = '"settings" -> SettingsScreen(speech, preferences, initialTheme, onThemeChange, onFontScaleChange, onLockApp, { screen = "sync" })'
          if old_call in main:
              main = main.replace(old_call, new_call, 1)
          elif new_call not in main:
              raise SystemExit("Could not update SettingsScreen navigation call")
          main_path.write_text(main, encoding="utf-8")
          print("Replaced settings with seven functional groups and wired lock and Windows sync navigation.")
          PY

      - name: Prevent chapter screen stalls with lightweight queries and pagination
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, lzma
          from pathlib import Path
          payload = Path(".github/patch_chapters.py.xz.b64").read_text(encoding="ascii")
          Path("/tmp/patch_chapters.py").write_bytes(lzma.decompress(base64.b64decode(payload)))
          PY
          MAIN_FILE="$(find android-build/app/src/main/java -type f -name MainActivity.kt -print -quit)"
          test -n "$MAIN_FILE"
          PACKAGE_DIR="$(dirname "$MAIN_FILE")"
          python3 /tmp/patch_chapters.py "$PACKAGE_DIR"
          python3 - "$PACKAGE_DIR" <<'PY'
          from pathlib import Path
          import sys
          package = Path(sys.argv[1])
          dao = (package / "data/local/AppDatabase.kt").read_text(encoding="utf-8")
          ui = (package / "ui/StudyScreens.kt").read_text(encoding="utf-8")
          required = ["fun observeItemCount()", "fun getChapterPage(", "fun getChapterFilteredCount(", "fun observeByUids("]
          missing = [item for item in required if item not in dao]
          if missing:
              raise SystemExit("Missing optimized DAO methods: " + ", ".join(missing))
          for screen in ("DashboardScreen", "ChapterListScreen", "ProgressScreen"):
              start = ui.index("fun " + screen + "(")
              end = ui.find("\n@Composable", start)
              block = ui[start:end if end >= 0 else len(ui)]
              if "contentItemDao().observeAll()" in block:
                  raise SystemExit(screen + " still loads full content rows")
          chapter_start = ui.index("fun ChapterContentScreen(")
          chapter_end = ui.index("\n@Composable", chapter_start)
          chapter = ui[chapter_start:chapter_end]
          if "getChapterPage(" not in chapter or "pageSize = 30" not in chapter:
              raise SystemExit("Chapter screen did not receive 30-row paging")
          print("Chapter performance assertions passed.")
          PY

      - name: Remove full content-table observation from subject screen
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_DIR="$(dirname "$(find android-build/app/src/main/java -type f -name MainActivity.kt -print -quit)")"
          SCREENS="$PACKAGE_DIR/ui/StudyScreens.kt"
          DAO="$PACKAGE_DIR/data/local/AppDatabase.kt"
          test -s "$SCREENS" && test -s "$DAO"
          grep -q 'fun observeItemCount(): Flow<Int>' "$DAO"
          python3 - "$SCREENS" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          source = path.read_text(encoding="utf-8")
          old_observation = 'val items by db.contentItemDao().observeAll().collectAsState(initial = emptyList())'
          new_observation = 'val allItemsCount by db.contentItemDao().observeItemCount().collectAsState(initial = 0)'
          if source.count(old_observation) != 1:
              raise SystemExit("Expected exactly one full-table observation in SubjectListScreen; refusing an ambiguous edit")
          source = source.replace(old_observation, new_observation, 1)
          old_label = 'Text("${subjects.size} موضوع · ${chapters.size} فصل · ${items.size} مطلب",'
          new_label = 'Text("${subjects.size} موضوع · ${chapters.size} فصل · ${allItemsCount} مطلب",'
          if source.count(old_label) != 1:
              raise SystemExit("Subject summary count label was not found exactly once")
          source = source.replace(old_label, new_label, 1)
          start = source.find("fun SubjectListScreen(")
          end = source.find("@Composable", start + 1)
          if start < 0 or end < 0:
              raise SystemExit("Could not isolate SubjectListScreen for safety assertions")
          screen = source[start:end]
          if "contentItemDao().observeAll()" in screen or "allItemsCount" not in screen:
              raise SystemExit("SubjectListScreen still collects the full content table")
          path.write_text(source, encoding="utf-8")
          print("Subject list now uses a count-only DAO flow; it no longer loads every lesson body to show the total.")
          PY
          grep -q 'val allItemsCount by db.contentItemDao().observeItemCount().collectAsState(initial = 0)' "$SCREENS"
          if sed -n '/fun SubjectListScreen(/,/^@Composable/p' "$SCREENS" | grep -q 'contentItemDao().observeAll()'; then
            echo "Full content-table observation remains in SubjectListScreen." >&2
            exit 1
          fi
          echo "Subject-list memory safety assertions passed."


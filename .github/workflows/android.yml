              screens = screens.replace(anchor, anchor + '''
              var lessonLoadError by remember(chapterId) { mutableStateOf("") }
              var lessonLoadAttempt by remember(chapterId) { mutableIntStateOf(0) }
              val lessonContext = LocalContext.current''', 1)

              effect = "    LaunchedEffect(chapterId, selectedType, query) {"

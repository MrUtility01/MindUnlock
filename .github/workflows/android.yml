                      confirmButton = {
                          Button(onClick = {
                              onThemeChange("dark")
                              fontScale = 1f
                              onFontScaleChange(1f)
                              readingLineSpacing = 1.45f
                              readingHorizontalMargin = 16f
                              keepScreenOnWhileReading = true
                              speed = 1f
                              voiceName = "gyro"
                              preferences.edit()
                                  .putString("theme", "dark")
                                  .putFloat("font_scale", 1f)
                                  .putFloat("reading_line_spacing", 1.45f)
                                  .putFloat("reading_horizontal_margin", 16f)
                                  .putBoolean("keep_screen_on_while_reading", true)
                                  .putFloat("speech_rate", 1f)
                                  .putString("speech_voice", "gyro")
                                  .apply()
                              speech.stop()
                              settingsMessage = "تنظیمات بازنشانی شد؛ اطلاعات شخصی و رمز قفل حفظ شده‌اند."
                              showResetDialog = false
                          }) { Text("تأیید بازنشانی") }
                      },
                      dismissButton = {
                          TextButton(onClick = { showResetDialog = false }) { Text("انصراف") }
                      }
                  )
              }
          }
          '''

          source = source[:start] + settings + "\n\n" + source[end:]
          required_imports = [
              "import androidx.compose.foundation.clickable",
              "import androidx.compose.foundation.layout.Arrangement",
              "import androidx.compose.foundation.layout.Column",
              "import androidx.compose.foundation.layout.Row",
              "import androidx.compose.foundation.layout.fillMaxSize",
              "import androidx.compose.foundation.layout.fillMaxWidth",
              "import androidx.compose.foundation.layout.padding",
              "import androidx.compose.foundation.rememberScrollState",
              "import androidx.compose.foundation.verticalScroll",
              "import androidx.compose.material3.AlertDialog",
              "import androidx.compose.material3.Button",
              "import androidx.compose.material3.Card",
              "import androidx.compose.material3.CardDefaults",
              "import androidx.compose.material3.HorizontalDivider",
              "import androidx.compose.material3.LinearProgressIndicator",
              "import androidx.compose.material3.MaterialTheme",
              "import androidx.compose.material3.OutlinedButton",
              "import androidx.compose.material3.OutlinedTextField",
              "import androidx.compose.material3.RadioButton",
              "import androidx.compose.material3.Slider",
              "import androidx.compose.material3.Text",
              "import androidx.compose.material3.TextButton",              "import androidx.compose.runtime.Composable",
              "import androidx.compose.runtime.getValue",
              "import androidx.compose.runtime.mutableStateOf",
              "import androidx.compose.runtime.remember",
              "import androidx.compose.runtime.setValue",
              "import androidx.compose.ui.Alignment",
              "import androidx.compose.ui.Modifier",
              "import androidx.compose.ui.platform.LocalContext",
              "import androidx.compose.ui.text.font.FontWeight",
              "import androidx.compose.ui.text.input.PasswordVisualTransformation",
              "import androidx.compose.ui.unit.dp",
          ]
          lines = source.splitlines()
          for item in required_imports:
              if item not in lines:
                  lines.insert(1, item)
          screens_path.write_text("\n".join(lines) + "\n", encoding="utf-8")

          main = main_path.read_text(encoding="utf-8")
          old_call = '"settings" -> SettingsScreen(speech, preferences, initialTheme, onThemeChange, onFontScaleChange)'
          new_call = '"settings" -> SettingsScreen(speech, preferences, initialTheme, onThemeChange, onFontScaleChange, onLockApp, { screen = "sync" })'
          if old_call in main:
              main = main.replace(old_call, new_call, 1)
          elif new_call not in main:
              raise SystemExit("Could not update SettingsScreen navigation call")
          main_path.write_text(main, encoding="utf-8")
          print("Replaced settings with seven functional groups and wired lock and Windows sync navigation.")
          PY

      - name: Prevent chapter screen stalls with lightweight queries and pagination
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, lzma
          from pathlib import Path
          payload = Path(".github/patch_chapters.py.xz.b64").read_text(encoding="ascii")
          Path("/tmp/patch_chapters.py").write_bytes(lzma.decompress(base64.b64decode(payload)))
          PY
          MAIN_FILE="$(find android-build/app/src/main/java -type f -name MainActivity.kt -print -quit)"
          test -n "$MAIN_FILE"
          PACKAGE_DIR="$(dirname "$MAIN_FILE")"
          python3 /tmp/patch_chapters.py "$PACKAGE_DIR"
          python3 - "$PACKAGE_DIR" <<'PY'
          from pathlib import Path
          import sys
          package = Path(sys.argv[1])
          dao = (package / "data/local/AppDatabase.kt").read_text(encoding="utf-8")
          ui = (package / "ui/StudyScreens.kt").read_text(encoding="utf-8")
          required = ["fun observeItemCount()", "fun getChapterPage(", "fun getChapterFilteredCount(", "fun observeByUids("]

              screens = screens.replace(clear_block, """        loadedItems.clear()
                  lessonLoadError = ""
                  try {""", 1)

              first_pattern = r'(loadedItems\.addAll\(firstPage\)\s*)\}\s*finally\s*\{\s*loading = false\s*\}'
              first_replacement = r'''\1} catch (error: kotlinx.coroutines.CancellationException) {
                      throw error
                  } catch (error: Exception) {
                      lessonLoadError = error.message ?: "خطا در بارگذاری فصل رخ داد."
                      android.util.Log.e("MindUnlockLesson", "Chapter load failed: " + chapterId, error)
                      CrashDiagnostics.recordHandled(lessonContext, "ChapterContentScreen:" + chapterId, error)
                  } finally {
                      loading = false
                  }'''
              screens, count = re.subn(first_pattern, first_replacement, screens, count=1)
              if count != 1:
                  raise SystemExit("Could not add ChapterContentScreen first-page error handling")

              next_pattern = r'(loadedItems\.addAll\(nextPage\)\s*)\}\s*finally\s*\{\s*loading = false\s*\}'
              next_replacement = r'''\1} catch (error: kotlinx.coroutines.CancellationException) {
                                            throw error
                                        } catch (error: Exception) {
                                            lessonLoadError = error.message ?: "بارگذاری مطالب بعدی ناموفق بود."
                                            android.util.Log.e("MindUnlockLesson", "Chapter pagination failed: " + chapterId, error)
                                            CrashDiagnostics.recordHandled(lessonContext, "ChapterPagination:" + chapterId, error)
                                        } finally {
                                            loading = false
                                        }'''
              screens, count = re.subn(next_pattern, next_replacement, screens, count=1)
              if count != 1:
                  raise SystemExit("Could not add ChapterContentScreen pagination error handling")

              empty_anchor = '            if (loadedItems.isEmpty() && !loading) item { EmptyMessage("مطلبی با این فیلتر پیدا نشد.") }'
              error_ui = """            if (lessonLoadError.isNotBlank()) item {
                          Card(Modifier.fillMaxWidth()) {
                              Column(Modifier.padding(12.dp), verticalArrangement = Arrangement.spacedBy(8.dp)) {
                                  Text("بارگذاری درس با خطا روبه‌رو شد", color = MaterialTheme.colorScheme.error, fontWeight = FontWeight.SemiBold)
                                  Text(lessonLoadError, style = MaterialTheme.typography.bodySmall)
                                  TextButton(onClick = { lessonLoadAttempt += 1 }) { Text("تلاش مجدد") }
                              }
                          }
                      }
          """ + empty_anchor
              if empty_anchor not in screens:
                  raise SystemExit("Chapter error UI insertion point missing")
              screens = screens.replace(empty_anchor, error_ui, 1)

          # Keep oversized lesson bodies out of CursorWindow rows. Room projections
          # read metadata and the large text column separately.
          dao_path = main_path.parent / "data" / "local" / "AppDatabase.kt"
          dao = dao_path.read_text(encoding="utf-8")
          if "fun observeMetadata(uid: String)" not in dao:
              dao_anchor = "interface ContentItemDao {"
              if dao_anchor not in dao:
                  raise SystemExit("ContentItemDao declaration missing")
              dao = dao.replace(dao_anchor, dao_anchor + """
              @Query("SELECT uid, chapterId, type, title, orderIndex, optionsJson, answer, explanation, metadataJson FROM content_items WHERE uid = :uid LIMIT 1")
              fun observeMetadata(uid: String): Flow<ContentItemEntity?>

              @Query("SELECT content FROM content_items WHERE uid = :uid LIMIT 1")
              fun observeContent(uid: String): Flow<String?>
              """, 1)
          dao = dao.replace(
              'SELECT * FROM content_items WHERE chapterId = :chapterId ORDER BY orderIndex, title LIMIT :limit OFFSET :offset',
              'SELECT uid, chapterId, type, title, orderIndex, optionsJson, answer, explanation, metadataJson FROM content_items WHERE chapterId = :chapterId ORDER BY orderIndex, title LIMIT :limit OFFSET :offset'
          )
          dao_path.write_text(dao, encoding="utf-8")

          # Protect ReaderScreen's database flow, preserve the stack trace, and let
          # a user retry without restarting the entire application.
          flow_import = "import kotlinx.coroutines.flow.catch"
          if flow_import not in screens:
              package_end = screens.find("\n")
              if package_end < 0:
                  raise SystemExit("StudyScreens package declaration missing")
              screens = screens[:package_end + 1] + "\n" + flow_import + screens[package_end + 1:]

          old_reader = """    val item by db.contentItemDao().observe(itemUid).collectAsState(initial = null)
              val scope = rememberCoroutineScope()
              val context = LocalContext.current"""
          new_reader = """    val context = LocalContext.current
              var readerLoadError by remember(itemUid) { mutableStateOf("") }
              var readerLoadAttempt by remember(itemUid) { mutableIntStateOf(0) }
              val metadataFlow = remember(db, itemUid, readerLoadAttempt, context) {
                  db.contentItemDao().observeMetadata(itemUid).catch { error ->
                      readerLoadError = error.message ?: "خواندن اطلاعات این مطلب ناموفق بود."
                      android.util.Log.e("MindUnlockLesson", "Reader metadata failed: " + itemUid, error)
                      CrashDiagnostics.recordHandled(context, "ReaderMetadata:" + itemUid, error)
                      emit(null)
                  }
              }
              val contentFlow = remember(db, itemUid, readerLoadAttempt, context) {
                  db.contentItemDao().observeContent(itemUid).catch { error ->
                      readerLoadError = error.message ?: "خواندن متن این مطلب ناموفق بود."
                      android.util.Log.e("MindUnlockLesson", "Reader content failed: " + itemUid, error)
                      CrashDiagnostics.recordHandled(context, "ReaderContent:" + itemUid, error)
                      emit(null)
                  }
              }
              val itemMetadata by metadataFlow.collectAsState(initial = null)
              val itemContent by contentFlow.collectAsState(initial = null)
              val item = itemMetadata?.copy(content = itemContent)
              val scope = rememberCoroutineScope()"""
          if old_reader in screens:
              screens = screens.replace(old_reader, new_reader, 1)
          elif "val metadataFlow = remember(db, itemUid, readerLoadAttempt, context)" not in screens:
              raise SystemExit("ReaderScreen metadata Flow insertion point missing")

          old_missing = """    if (item == null) {
                  EmptyMessage("این محتوا در حافظهٔ محلی پیدا نشد.")
                  return
              }"""
          new_missing = """    if (item == null) {
                  if (readerLoadError.isNotBlank()) {
                      Column(Modifier.fillMaxWidth().padding(16.dp), verticalArrangement = Arrangement.spacedBy(10.dp)) {
                          Text("باز کردن مطلب با خطا روبه‌رو شد", color = MaterialTheme.colorScheme.error, fontWeight = FontWeight.SemiBold)
                          Text(readerLoadError, style = MaterialTheme.typography.bodySmall)
                          OutlinedButton(onClick = { readerLoadError = ""; readerLoadAttempt += 1 }) { Text("تلاش مجدد") }
                      }
                  } else {
                      EmptyMessage("در حال بارگذاری مطلب…")
                  }
                  return
              }"""
          if old_missing in screens:
              screens = screens.replace(old_missing, new_missing, 1)
          elif "باز کردن مطلب با خطا روبه‌رو شد" not in screens:
              raise SystemExit("ReaderScreen missing-item UI marker not found")

          # Decode lesson images on IO with a bounded bitmap size to avoid memory
          # spikes from full-resolution camera/scanner images.
          if "private fun SafeLocalCachedImage(" not in screens:
              old_image_call = "LocalCachedImage(cached.localPath)"
              if old_image_call not in screens:
                  raise SystemExit("Reader image rendering call not found")
              screens = screens.replace(old_image_call, "SafeLocalCachedImage(cached.localPath)", 1)
              screens += '''

          @Composable
          private fun SafeLocalCachedImage(path: String) {
              val bitmap by produceState<android.graphics.Bitmap?>(initialValue = null, key1 = path) {
                  value = withContext(Dispatchers.IO) {
                      try {
                          val file = File(path)
                          if (!file.isFile || file.length() <= 0L) {
                              null
                          } else {
                              val bounds = android.graphics.BitmapFactory.Options().apply { inJustDecodeBounds = true }
                              android.graphics.BitmapFactory.decodeFile(file.absolutePath, bounds)
                              if (bounds.outWidth <= 0 || bounds.outHeight <= 0) {
                                  null
                              } else {
                                  var sample = 1
                                  while (bounds.outWidth / sample > 1440 || bounds.outHeight / sample > 1920) {
                                      sample *= 2
                                  }
                                  val options = android.graphics.BitmapFactory.Options().apply {
                                      inSampleSize = sample
                                      inPreferredConfig = android.graphics.Bitmap.Config.RGB_565
                                  }
                                  android.graphics.BitmapFactory.decodeFile(file.absolutePath, options)
                              }
                          }
                      } catch (error: Exception) {
                          android.util.Log.w("MindUnlockImage", "Could not decode cached lesson image: " + path, error)
                          null
                      }
                  }
              }
              if (bitmap != null) {
                  Image(
                      bitmap = bitmap!!.asImageBitmap(),
                      contentDescription = "تصویر مطلب",
                      modifier = Modifier.fillMaxWidth(),
                      contentScale = ContentScale.Fit
                  )
              } else {
                  Text("تصویر این مطلب قابل نمایش نیست.", style = MaterialTheme.typography.bodySmall, color = MaterialTheme.colorScheme.onSurfaceVariant)
              }
          }
          '''

          screens_path.write_text(screens, encoding="utf-8")

          # Crash report also records which route was last composed.
          route_marker = "        when (screen) {"
          if "CrashDiagnostics.setCurrentScreen(" not in main:
              if route_marker not in main:
                  raise SystemExit("MainActivity screen routing marker missing")
              route = '        androidx.compose.runtime.SideEffect { CrashDiagnostics.setCurrentScreen("screen=" + screen + "; item=" + selectedItem) }\n'
              main = main.replace(route_marker, route + route_marker, 1)
              main_path.write_text(main, encoding="utf-8")

          assert "lessonLoadError" in screens
          assert "readerLoadError" in screens
          assert "SafeLocalCachedImage" in screens
          assert "fun recordHandled(context: Context" in crash_path.read_text(encoding="utf-8")
          print("Lesson loading now has retryable database error handling, bounded off-main-thread image decoding and detailed local diagnostics.")
          PY

          python3 - <<'PY'
          from pathlib import Path
          p = Path("android-build/app/build.gradle.kts")
          source = p.read_text(encoding="utf-8")
          if "versionCode = 6" not in source or 'versionName = "0.5.1"' not in source:
              raise SystemExit("Expected v0.5.1 package version markers not found")
          source = source.replace("versionCode = 6", "versionCode = 7", 1)
          source = source.replace('versionName = "0.5.1"', 'versionName = "0.5.2"', 1)
          p.write_text(source, encoding="utf-8")
          print("Package version bumped to 0.5.2 (versionCode 7).")
          PY

      - name: Fix Room projections to include required sourceStatus column
        shell: bash
        run: |
          set -euo pipefail
          DAO_FILE="$(find android-build/app/src/main/java -type f -path '*/data/local/AppDatabase.kt' -print -quit)"
          test -n "$DAO_FILE"
          python3 - "$DAO_FILE" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          s = p.read_text(encoding="utf-8")
          old = "explanation, metadataJson FROM content_items"
          new = "explanation, sourceStatus, metadataJson FROM content_items"
          count = s.count(old)
          if count < 2:
              raise SystemExit(f"Expected at least two Room projections, found {count}; refusing incomplete fix")
          s = s.replace(old, new)
          p.write_text(s, encoding="utf-8")
          print(f"Added sourceStatus to {count} Room projections.")
          PY

      - name: Run JVM unit tests
        working-directory: android-build
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build Debug APK
        working-directory: android-build
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify APK integrity and package metadata
        shell: bash
        run: |
          set -euo pipefail
          APK="android-build/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n1)"
          test -n "$AAPT"
          "$AAPT" dump badging "$APK" | tee /tmp/apk-badging.txt
          grep -Eq "^package: name='com\\.mindunlock\\.app(\\.debug)?'" /tmp/apk-badging.txt
          echo "APK_SIZE_BYTES=$(stat -c%s "$APK")" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "APK archive integrity and application package verified." | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MindUnlock-Android-v0.5.1-debug
          path: android-build/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish GitHub Release with APK
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v0.5.2-${{ github.run_number }}
          name: MindUnlock Android 0.5.2 (#${{ github.run_number }})
          body: |
            Android Native 0.5.2 with guarded lesson loading, bounded image decoding, local error reports and non-blocking database migration, defensive chapter loading and validated APK packaging.
            HTTP sync is intended for trusted local networks only.
          files: android-build/app/build/outputs/apk/debug/app-debug.apk
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}